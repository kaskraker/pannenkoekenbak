<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EB">
<title>Feed · Pannenkoekenverkoop Ingelmunster</title>
<link rel="icon" href="assets/icon-192.png">
<style>
:root{--bone:#F4F1EB;--pagina:#FAF8F4;--kaart:#EFEAE1;--lijn:#D5CCBF;--donker:#272727;--tekst:#3c3c3b;--zacht:#6f695d;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bone);color:var(--tekst);font:500 15.5px/1.42 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;gap:12px;margin:6px 2px 16px}
.head a{width:40px;height:40px;border-radius:50%;background:rgba(39,39,39,.06);box-shadow:var(--glow),var(--edge);display:flex;align-items:center;justify-content:center;color:var(--donker);text-decoration:none;flex:none}
.head a svg{width:20px;height:20px}
.head h1{margin:0;font-size:26px;letter-spacing:-.025em;color:var(--donker);line-height:1.1}
.head small{display:block;color:var(--zacht);font-size:14px;font-weight:500;letter-spacing:0}
.hero{display:flex;align-items:center;gap:16px;background:var(--pagina);border-radius:24px;padding:16px 18px;box-shadow:var(--glow),var(--edge),var(--sh);margin-bottom:16px}
.ring{position:relative;width:76px;height:76px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.6;stroke-linecap:round}.ring .tr{stroke:rgba(39,39,39,.08)}.ring .pr{stroke:var(--donker);transition:stroke-dasharray 1.1s var(--sp)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:21px;letter-spacing:-.03em;color:var(--donker);font-variant-numeric:tabular-nums}
.hero .t b{display:block;font-size:19px;color:var(--donker);letter-spacing:-.015em}.hero .t span{color:var(--zacht);font-size:14.5px}
.seg{position:sticky;top:8px;z-index:5;display:grid;grid-template-columns:repeat(2,1fr);background:rgba(244,241,235,.82);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-radius:99px;padding:4px;margin-bottom:16px;box-shadow:var(--edge),var(--sh)}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:linear-gradient(180deg,#3d3d3d,#242424);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 8px rgba(39,39,39,.28);transform:translateX(calc(var(--i,0) * 100%));transition:transform .5s var(--spb)}
.seg button{position:relative;padding:9px 0;font-weight:600;font-size:14.5px;color:var(--zacht);transition:color .3s}.seg button[aria-selected=true]{color:#fff}
.view{animation:in .45s var(--sp) both}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;margin:0 -14px;padding-inline:14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:99px;background:rgba(39,39,39,.05);box-shadow:inset 0 0 0 1px rgba(39,39,39,.07);font-weight:600;font-size:14px;transition:transform .5s var(--spb),background .2s}
.chip[aria-pressed=true]{background:linear-gradient(180deg,#3b3b3b,#272727);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 6px rgba(39,39,39,.25)}
.chip:active{transform:scale(.95)}.chip .d{width:10px;height:10px;border-radius:50%}
/* bingo */
.bingo{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}

.pod{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:8px;align-items:end;margin:6px 0 20px}

.pod .p.first .step{height:92px}.pod .p.second .step{height:68px;background:linear-gradient(180deg,#6a6a6a,#444)}.pod .p.third .step{height:50px;background:linear-gradient(180deg,#8a8a8a,#5e5e5e)}
.rank{cursor:pointer;transition:transform .2s,background .2s;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--pagina);box-shadow:var(--glow),var(--edge);margin-bottom:7px}

.rank .m{flex:1;min-width:0}.rank .m b{display:block;color:var(--donker);font-size:16px}.rank .bar{height:6px;border-radius:9px;background:var(--kaart);margin-top:6px;overflow:hidden}.rank .bar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .9s var(--sp)}
.rank .v{font-size:20px;font-weight:800;color:var(--donker);font-variant-numeric:tabular-nums}.rank .v small{display:block;font-size:11.5px;font-weight:600;color:var(--zacht);text-align:right}

.count{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:22px;background:linear-gradient(180deg,#3d3d3d,#242424);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),var(--sh);margin-bottom:18px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,24px);opacity:0;pointer-events:none;background:rgba(34,34,34,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;box-shadow:var(--sh);transition:opacity .25s,transform .5s var(--spb);max-width:calc(100% - 24px);text-align:center;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{padding:40px 10px;text-align:center;color:var(--zacht)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,#3d3d3d,#242424);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 26px rgba(0,0,0,.3);z-index:15;transition:transform .5s var(--spb)}.fab:active{transform:scale(.9)}.fab svg{width:26px}
.rail{display:flex;gap:14px;overflow-x:auto;margin:0 -14px 14px;padding:2px 14px 6px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.bub{flex:none;width:68px;text-align:center;font-size:12.5px;font-weight:600;color:var(--zacht)}
.bub .r{width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(var(--c),#fff 40%,var(--c));margin:0 auto 5px;display:flex}
.bub.seen .r{background:var(--lijn)}.bub.add .r{background:none;border:2px dashed var(--lijn);align-items:center;justify-content:center;color:var(--zacht);font-size:26px;padding:0}

.evg{margin:0 0 10px;border-radius:18px;background:rgba(39,39,39,.04);font-size:13.5px;color:var(--zacht)}
.evg.solo{background:none}
.evl{display:flex;align-items:center;gap:8px;padding:6px 12px;line-height:1.3}.evl .av{flex:none;width:22px;height:22px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;background:var(--c);color:#fff}.evl .av img,.evs .av img{width:100%;height:100%;object-fit:cover}
.evt{flex:1;min-width:0;color:var(--tekst)}.evt a{color:var(--donker);font-weight:600;text-decoration:none}.evt b{color:var(--donker);font-weight:600}
.evl small,.evs small{flex:none;font-size:12px;color:var(--zacht)}
.evs{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;text-align:left;font:inherit;font-size:13.5px;color:var(--zacht)}
.evav{display:flex;flex:none}.evav .av{width:22px;height:22px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;background:var(--c);color:#fff;box-shadow:0 0 0 2px #F4F1EB}.evav .av+.av{margin-left:-7px}
.evs svg{flex:none;width:16px;height:16px;transition:transform .3s}.evg.open .evs svg{transform:rotate(180deg)}
.evb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}.evb>div{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .3s;padding:0 0 4px}
.evg.open .evb{grid-template-rows:1fr}.evg.open .evb>div{visibility:visible;transition-delay:0s}
.post{background:var(--pagina);border-radius:24px;padding:14px 14px 10px;box-shadow:var(--glow),var(--edge),var(--sh);margin-bottom:12px}
.ph{display:flex;align-items:center;gap:11px}.ph .av,.rank a.av{text-decoration:none}.ph .av{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c)}.ph .av img{width:100%;height:100%;object-fit:cover}

.ph .more{color:var(--zacht);padding:6px 8px;font-size:20px;line-height:1}
.pb{margin:10px 2px 8px;font-size:16px;line-height:1.38;color:var(--donker)}.pb a{color:var(--donker);font-weight:700;text-underline-offset:3px}
.ctg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-2px 0 2px}.ctg small{font-size:12.5px;font-weight:600;color:var(--zacht)}
.ctag{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 4px;border-radius:99px;background:rgba(39,39,39,.07);font-size:14px;font-weight:600;color:var(--donker)}.ctag .av{width:22px;height:22px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:10px;background:var(--c,#ccc);color:#fff}.ctag .av img{width:100%;height:100%;object-fit:cover}.ctag .av.pin{background:rgba(39,39,39,.1);color:var(--donker)}.ctag button{width:22px;height:22px;border-radius:50%;font-size:16px;line-height:1;color:var(--zacht)}
a.mention{color:var(--donker);font-weight:700;text-decoration:none;background:rgba(39,39,39,.07);border-radius:7px;padding:0 5px}
.mnt{position:fixed;z-index:80;display:none;flex-direction:column;min-width:200px;max-width:calc(100vw - 24px);padding:5px;border-radius:18px;background:rgba(252,250,247,.97);box-shadow:var(--glow),var(--edge),0 12px 36px rgba(39,39,39,.22)}
.mnt.on{display:flex}.mnt button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:12px;text-align:left;font:inherit;font-size:15.5px;font-weight:600;color:var(--donker)}.mnt button:active,.mnt button.hi{background:rgba(39,39,39,.07)}.mnt .av{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--c,#ccc);color:#fff}.mnt .av img{width:100%;height:100%;object-fit:cover}.mnt .av.pin{background:rgba(39,39,39,.09);color:var(--donker)}
.pimg{width:100%;border-radius:18px;display:block;margin:8px 0;background:var(--kaart);max-height:460px;object-fit:cover}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:700;background:rgba(39,39,39,.06)}.badge i{width:8px;height:8px;border-radius:50%;background:var(--c)}.badge.dashed i{background:transparent;border:2px dashed var(--c);width:10px;height:10px}
.act{display:flex;gap:6px;margin:4px -4px 0;color:var(--zacht)}
.like{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;font-weight:700;font-size:14px;transition:transform .5s var(--spb),background .2s}
.like svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.like.on{color:#e0245e}.like.on svg{fill:#e0245e;stroke:#e0245e}.like.pop svg{animation:heart .55s var(--spb)}
.like:active{transform:scale(.92)}@keyframes heart{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
dialog{border:0;border-radius:28px;padding:20px;width:min(440px,calc(100% - 20px));background:rgba(252,250,247,.98);box-shadow:var(--glow),var(--edge),0 24px 60px rgba(39,39,39,.3);color:var(--tekst);font:inherit}
dialog::backdrop{background:rgba(30,26,22,.4);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
dialog[open]{animation:in .45s var(--spb)}
dialog h2{margin:0 0 12px;font-size:22px;letter-spacing:-.02em;color:var(--donker)}

dialog textarea:focus,dialog select:focus{box-shadow:inset 0 0 0 1.5px var(--donker),0 0 0 3px rgba(0,0,0,.08)}
.rw{display:flex;gap:10px;align-items:center;margin-top:10px}
.pickb{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:16px;background:rgba(39,39,39,.05);box-shadow:inset 0 0 0 1px rgba(39,39,39,.07);font-weight:600}

.sw{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-weight:600}

.story{position:fixed;inset:0;z-index:50;background:#111;display:none;flex-direction:column;color:#fff}.story.on{display:flex;animation:in .35s var(--sp)}
.story .bars{display:flex;gap:4px;padding:max(12px,env(safe-area-inset-top)) 12px 8px}.story .bars i{flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}.story .bars i b{display:block;height:100%;width:0;background:#fff}.story .bars i.d b{width:100%}

.story .tap{position:absolute;inset:0;display:flex}.story .tap div{flex:1}.story .tap div:first-child{flex:.4}
.story .txtonly{padding:30px;font-size:26px;font-weight:700;text-align:center;line-height:1.3;letter-spacing:-.02em}
.rank.me{box-shadow:var(--glow),inset 0 0 0 2px var(--donker)}
.rank .n{font-size:18px}.rank .n.m1{color:#c79a1a}.rank .n.m2{color:#8d8d93}.rank .n.m3{color:#a5683a}

  if (D.cst) { cmp.street = cmp.street === D.cst ? '' : D.cst; syncSug(); return; }
  if (D.a === 'cpick') return pickPhoto();
  if (D.a === 'cdrop') { if (cmp.isVideo) { cmp.items = []; cmp.isVideo = false; } else cmp.items.splice(+D.i || 0, 1); cmp.text = $('tx').value; drawCmp(false, 'resize'); return; }
  if (D.a === 'cno') { cmpReset(); drawCmp(false, 'close'); return; }
  if (D.a === 'cgo') return cmpGo();
  if (D.lk) return likersDialog(D.lk, t);
  if (D.more) return postMenu(D.more);
  if (D.del) { if (!confirm('Dit bericht verwijderen?')) return; if (demo) posts = posts.filter(p => p.id !== D.del); else { const r = await sb.from('feed_posts').delete().eq('id', D.del); if (r.error) return toast('Verwijderen mislukt'); await window.__reload(); } render(); }
});
$('fab').addEventListener('click', () => compose(false));
$('lb').addEventListener('click', e => { if (e.target === $('lb') || e.target.classList.contains('lbi')) closeLb(false); });
$('lb').addEventListener('dblclick', e => { const k = $('lb').dataset.k, b = $('lb').querySelector('[data-lblike]'); if (e.target.tagName === 'IMG' && b && !liked(k)) toggleLike(k, b); });
addEventListener('keydown', e => { if (e.key === 'Escape' && $('lb').classList.contains('on')) closeLb(false); });
const EMBED = window.top !== window.self;
if (EMBED) {
  document.documentElement.classList.add('embed');
  addEventListener('message', e => { if (e.origin !== location.origin || !e.data) return; const t = e.data.tab; if (e.data.space) document.documentElement.style.setProperty('--tabspace', e.data.space + 'px'); if (t && t !== tab) { tab = t; render(true); scrollTo(0, 0); } if (e.data.top) scrollTo({ top: 0, behavior: 'smooth' }); });
  const q = new URLSearchParams(location.search).get('tab'); if (q === 'rang') tab = 'rang';
  document.addEventListener('click', e => { const a = e.target.closest('[data-go]'); if (!a) return; e.preventDefault(); const [k, id] = a.dataset.go.split(':'); parent.postMessage({ go: k, id }, location.origin); }, true);
  parent.postMessage({ ready: 'feed' }, location.origin);
}
window.__refresh = async () => { if (await window.__updateApp()) return; if (window.__reload && !demo) await window.__reload(); else render(); };
render(true);
})();
