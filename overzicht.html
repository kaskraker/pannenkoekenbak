<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#F4F1EB">
<title>Feed · Pannenkoekenverkoop Ingelmunster</title>
<link rel="icon" href="assets/symbool.png">
<style>
:root{--bone:#F4F1EB;--pagina:#FAF8F4;--kaart:#EFEAE1;--lijn:#D5CCBF;--donker:#272727;--tekst:#3c3c3b;--zacht:#6f695d;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;

button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;gap:12px;margin:6px 2px 16px}

.seg{position:sticky;top:8px;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(244,241,235,.82);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-radius:99px;padding:4px;margin-bottom:16px;box-shadow:var(--edge),var(--sh)}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(33.333% - 2.7px);border-radius:99px;background:linear-gradient(180deg,#3d3d3d,#242424);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 8px rgba(39,39,39,.28);transform:translateX(calc(var(--i,0) * 100%));transition:transform .5s var(--spb)}

.chip:active{transform:scale(.95)}.chip .d{width:10px;height:10px;border-radius:50%}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,24px);opacity:0;pointer-events:none;background:rgba(34,34,34,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;box-shadow:var(--sh);transition:opacity .25s,transform .5s var(--spb);max-width:calc(100% - 24px);text-align:center;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,#3d3d3d,#242424);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 26px rgba(0,0,0,.3);z-index:15;transition:transform .5s var(--spb)}.fab:active{transform:scale(.9)}.fab svg{width:26px}
.rail{display:flex;gap:14px;overflow-x:auto;margin:0 -14px 14px;padding:2px 14px 6px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.bub{flex:none;width:68px;text-align:center;font-size:12.5px;font-weight:600;color:var(--zacht)}
.bub .r{width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(var(--c),#fff 40%,var(--c));margin:0 auto 5px;display:flex}
.bub.seen .r{background:var(--lijn)}.bub.add .r{background:none;border:2px dashed var(--lijn);align-items:center;justify-content:center;color:var(--zacht);font-size:26px;padding:0}
.bub .a{flex:1;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;box-shadow:0 0 0 2px #fff}.bub .a img{width:100%;height:100%;object-fit:cover}
.post{background:var(--pagina);border-radius:24px;padding:14px 14px 10px;box-shadow:var(--glow),var(--edge),var(--sh);margin-bottom:12px}
.ph{display:flex;align-items:center;gap:11px}.ph .av,.rank a.av{text-decoration:none}.ph .av{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c)}.ph .av img{width:100%;height:100%;object-fit:cover}
.ph .who{flex:1;min-width:0;line-height:1.25}.ph .who a{color:var(--donker);font-weight:700;text-decoration:none}.ph .who small{display:block;color:var(--zacht);font-size:12.5px}
.ph .more{color:var(--zacht);padding:6px 8px;font-size:20px;line-height:1}
.pb{margin:10px 2px 8px;font-size:16px;line-height:1.38;color:var(--donker)}.pb a{color:var(--donker);font-weight:700;text-underline-offset:3px}
.pimg{width:100%;border-radius:18px;display:block;margin:8px 0;background:var(--kaart);max-height:460px;object-fit:cover}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:700;background:rgba(39,39,39,.06)}.badge i{width:8px;height:8px;border-radius:50%;background:var(--c)}.badge.dashed i{background:transparent;border:2px dashed var(--c);width:10px;height:10px}
.act{display:flex;gap:6px;margin:4px -4px 0;color:var(--zacht)}
.like{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;font-weight:700;font-size:14px;transition:transform .5s var(--spb),background .2s}
.like svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.like.on{color:#e0245e}.like.on svg{fill:#e0245e;stroke:#e0245e}.like.pop svg{animation:heart .55s var(--spb)}
.like:active{transform:scale(.92)}@keyframes heart{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
dialog{border:0;border-radius:28px;padding:20px;width:min(440px,calc(100% - 20px));background:rgba(252,250,247,.98);box-shadow:var(--glow),var(--edge),0 24px 60px rgba(39,39,39,.3);color:var(--tekst);font:inherit}
dialog::backdrop{background:rgba(30,26,22,.4);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
dialog[open]{animation:in .45s var(--spb)}
dialog h2{margin:0 0 12px;font-size:22px;letter-spacing:-.02em;color:var(--donker)}
dialog textarea,dialog select{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:0;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--lijn);color:var(--donker);outline:none;resize:none}
dialog textarea:focus,dialog select:focus{box-shadow:inset 0 0 0 1.5px var(--donker),0 0 0 3px rgba(0,0,0,.08)}
.rw{display:flex;gap:10px;align-items:center;margin-top:10px}
.pickb{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:16px;background:rgba(39,39,39,.05);box-shadow:inset 0 0 0 1px rgba(39,39,39,.07);font-weight:600}
.prev{width:100%;border-radius:18px;margin-top:10px;display:block;max-height:260px;object-fit:cover}
.sw{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-weight:600}
.tg{width:52px;height:31px;border-radius:99px;background:rgba(39,39,39,.16);position:relative;transition:background .3s;flex:none}.tg::after{content:"";position:absolute;left:3px;top:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .5s var(--spb)}.tg.on{background:#272727}.tg.on::after{transform:translateX(21px)}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:99px;font-weight:700;font-size:16px;background:linear-gradient(180deg,#3d3d3d,#242424);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 18px rgba(0,0,0,.22);margin-top:16px;transition:transform .5s var(--spb)}.btn:active{transform:scale(.97)}.btn.g{background:rgba(39,39,39,.06);color:var(--donker);box-shadow:inset 0 0 0 1px rgba(39,39,39,.07)}.btn:disabled{opacity:.4}
.story{position:fixed;inset:0;z-index:50;background:#111;display:none;flex-direction:column;color:#fff}.story.on{display:flex;animation:in .35s var(--sp)}
.story .bars{display:flex;gap:4px;padding:max(12px,env(safe-area-inset-top)) 12px 8px}.story .bars i{flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}.story .bars i b{display:block;height:100%;width:0;background:#fff}.story .bars i.d b{width:100%}
.story .top{display:flex;align-items:center;gap:10px;padding:4px 14px 10px}.story .top .av{width:34px;height:34px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden}.story .top .av img{width:100%;height:100%;object-fit:cover}.story .top small{opacity:.7;display:block;font-size:12px}.story .top button{margin-left:auto;color:#fff;font-size:28px;padding:0 6px}
.story .body{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}.story .body img{max-width:100%;max-height:100%;object-fit:contain}.story .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 20px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:18px;line-height:1.35}
.story .tap{position:absolute;inset:0;display:flex}.story .tap div{flex:1}.story .tap div:first-child{flex:.4}
.story .txtonly{padding:30px;font-size:26px;font-weight:700;text-align:center;line-height:1.3;letter-spacing:-.02em}
.rank.me{box-shadow:var(--glow),inset 0 0 0 2px var(--donker)}
.rank .n{font-size:18px}.rank .n.m1{color:#c79a1a}.rank .n.m2{color:#8d8d93}.rank .n.m3{color:#a5683a}
.note{background:var(--kaart);border-radius:18px;padding:12px 14px;color:var(--zacht);font-size:14.5px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><a href="index.html" aria-label="Terug naar de kaart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><h1>Feed<small>Pannenkoekenverkoop Ingelmunster</small></h1></div>
  <div class="hero" id="hero"></div>
  <div class="seg" id="seg" style="--i:0"><button data-t="feed" aria-selected="true">Feed</button><button data-t="rang" aria-selected="false">Ranglijst</button><button data-t="buurt" aria-selected="false">A–Z</button></div>
  <div id="main"></div>
</div>
<button class="fab" id="fab" aria-label="Nieuw bericht"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>
<div class="story" id="story"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(async () => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg = window.PANNENKOEK_CONFIG || {}, demo = location.search.includes('demo') || !(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY);
const STREETS = await (await fetch('data/streets.json')).json(), byId = new Map(STREETS.map(s => [s.id, s])), TOTAL = STREETS.reduce((a, s) => a + s.len, 0);
const km = m => (m / 1000).toFixed(1).replace('.', ',') + ' km', initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
let people = [], claims = [], posts = [], likes = [], tab = 'feed', metric = 'km', shown = null, meId = null, hasFeed = true, sb = null, session = null;
const seen = new Set(JSON.parse(localStorage.getItem('pb-seen') || '[]'));

/* ---------- gegevens ---------- */
const photoOf = (c, k) => c;
if (demo) {
  const nm = ['Patrick', 'Anja', 'Lien', 'Sander', 'Marie', 'Tom', 'Eline', 'Bram'], col = ['#BA0C2F', '#3B5BDB', '#E8A300', '#2E9E5B', '#00A6B8', '#8A5A2B', '#F26B21', '#2B2B2B'];
  people = nm.map((n, i) => ({ id: 'p' + i, name: n, color: col[i] }));
  STREETS.slice(0, 120).forEach((s, i) => { if (i % 3 === 2) return; claims.push({ street_id: s.id, side: 'all', person_id: 'p' + ((i * 7) % 8), partner_id: null, status: ['done', 'done', 'busy', 'assigned'][i % 4], done_at: new Date(Date.now() - ((i * 5) % 9) * 864e5 - (i % 6) * 36e5).toISOString() }); });
  const g = (a, b) => { const c = document.createElement('canvas'); c.width = 600; c.height = 450; const x = c.getContext('2d'), gr = x.createLinearGradient(0, 0, 600, 450); gr.addColorStop(0, a); gr.addColorStop(1, b); x.fillStyle = gr; x.fillRect(0, 0, 600, 450); x.fillStyle = 'rgba(255,255,255,.9)'; x.font = '700 64px system-ui'; x.textAlign = 'center'; x.fillText('Pannenkoeken!', 300, 240); return c.toDataURL('image/jpeg', .8); };
  posts = [
    { id: 'x1', person_id: 'p2', street_id: STREETS[4].id, body: 'Eerste ronde gedaan, wat een leuke buurt! Iedereen was thuis.', photo_url: g('#E8A300', '#F26B21'), is_story: false, created_at: new Date(Date.now() - 36e5).toISOString() },
    { id: 'x2', person_id: 'p0', street_id: null, body: 'Vergeet je lijst niet in te vullen, mensen 🙂', photo_url: null, is_story: false, created_at: new Date(Date.now() - 5 * 36e5).toISOString() },
    { id: 'x3', person_id: 'p3', street_id: STREETS[9].id, body: 'Pauze met koffie', photo_url: g('#2E9E5B', '#00A6B8'), is_story: true, created_at: new Date(Date.now() - 2 * 36e5).toISOString() },
  ];
  likes = [{ target: 'x1', person_id: 'p0' }, { target: 'x1', person_id: 'p3' }];
  meId = localStorage.getItem('pb-me-demo') || 'p0';
} else {
  sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: true, detectSessionInUrl: true } });
  const load = async () => {
    const [p, d, f, l] = await Promise.all([sb.from('people').select('*'), sb.from('done_streets').select('*'), sb.from('feed_posts').select('*').order('created_at', { ascending: false }).limit(120), sb.from('feed_likes').select('*')]);
    if (p.error || d.error) throw (p.error || d.error);
    people = p.data; claims = d.data.map(c => ({ ...c, side: c.side || 'all', status: c.status || 'done' }));
    hasFeed = !f.error; posts = f.data || []; likes = l.data || [];
    try { const { data } = await sb.auth.getSession(); session = data.session; } catch {}
    const lm = localStorage.getItem('pb-me');
    meId = session ? (people.find(x => x.user_id === session.user.id)?.id || null) : (lm && people.some(x => x.id === lm) ? lm : null);
  };
  await load().catch(() => { $('main').innerHTML = '<div class="empty">Kan de gegevens niet laden.</div>'; });
  window.__reload = async () => { await load(); render(); };
  sb.channel('ov').on('postgres_changes', { event: '*', schema: 'public' }, () => window.__reload()).subscribe();
}
const pid = id => people.find(p => p.id === id), me = () => pid(meId);
const avHTML = p => p.photo_url ? `<img src="${esc(p.photo_url)}" alt="">` : esc(initials(p.name));
const ago = t => { const d = (Date.now() - t) / 6e4; return d < 1 ? 'zonet' : d < 60 ? Math.round(d) + ' min geleden' : d < 1440 ? Math.round(d / 60) + ' u geleden' : d < 2880 ? 'gisteren' : new Date(t).toLocaleDateString('nl-BE', { day: 'numeric', month: 'long' }); };
let toastT; const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); };

/* ---------- cijfers ---------- */
function stateOf(id) { const cs = claims.filter(c => c.street_id === id); if (!cs.length) return { st: 'none', cs }; const dn = cs.find(c => c.status === 'done'); return { st: dn ? 'done' : 'busy', cs }; }
function stats() {
  const m = new Map(people.map(p => [p.id, { p, n: 0, len: 0, b: 0 }])); let n = 0, len = 0;
  for (const s of STREETS) { const { st, cs } = stateOf(s.id); if (st === 'done') { n++; len += s.len; } const k = new Set();
    for (const c of cs) for (const id of [c.person_id, c.partner_id]) { const r = id && m.get(id); if (!r || k.has(id + c.status)) continue; k.add(id + c.status); if (c.status === 'done') { r.n++; r.len += s.len; } else r.b++; } }
  return { n, len, rows: [...m.values()] };
}
function hero() {
  const { n, len } = stats(), pct = Math.round(len / TOTAL * 100), from = shown ?? pct; shown = pct;
  $('hero').innerHTML = `<div class="ring"><svg viewBox="0 0 36 36"><circle class="tr" cx="18" cy="18" r="15.9155"/><circle class="pr" cx="18" cy="18" r="15.9155" pathLength="100" stroke-dasharray="${from} 100"/></svg><b>${pct}%</b></div><div class="t"><b>${n} van ${STREETS.length} straten</b><span>${km(len)} van ${km(TOTAL)}</span></div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => $('hero').querySelector('.pr')?.setAttribute('stroke-dasharray', pct + ' 100')));
}

/* ---------- feed ---------- */
const likeCount = t => likes.filter(l => l.target === t).length, liked = t => likes.some(l => l.target === t && l.person_id === meId);
const heart = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.700 3.700 4.500 7 4.500c1.900 0 3.400 1 5 3 1.600-2 3.100-3 5-3 3.300 0 5.400 3.200 4.200 6.600-1.700 4.800-9.200 9.400-9.200 9.400z"/></svg>';
const lnkStreet = s => `<a href="index.html#straat=${s.id}">${esc(s.name)}</a>`, lnkP = p => `<a href="index.html#persoon=${p.id}">${esc(p.name)}</a>`;
function feedItems() {
  const items = [];
  for (const c of claims) { const s = byId.get(c.street_id), a = pid(c.person_id); if (!s || !a) continue; items.push({ kind: 'ev', key: `ev:${c.street_id}:${c.side}:${c.status}`, t: +new Date(c.done_at), a, b: c.partner_id && pid(c.partner_id), s, c }); }
  for (const p of posts) { const a = pid(p.person_id); if (!a || (p.is_story && false)) continue; items.push({ kind: 'post', key: p.id, t: +new Date(p.created_at), a, s: p.street_id && byId.get(p.street_id), p }); }
  return items.sort((x, y) => y.t - x.t).slice(0, 80);
}
const stories = () => { const lim = Date.now() - 864e5, by = new Map(); for (const p of posts) if (p.is_story && +new Date(p.created_at) > lim && pid(p.person_id)) (by.get(p.person_id) || by.set(p.person_id, []).get(p.person_id)).push(p); for (const l of by.values()) l.sort((a, b) => +new Date(a.created_at) - +new Date(b.created_at)); return by; };
function feed() {
  let h = '';
  const st = stories();
  h += `<div class="rail"><button class="bub add" data-a="compose" data-story="1"><div class="r">+</div>Jouw verhaal</button>${[...st].map(([id, l]) => { const p = pid(id), all = l.every(x => seen.has(x.id)); return `<button class="bub ${all ? 'seen' : ''}" style="--c:${p.color}" data-story-of="${id}"><div class="r"><div class="a">${avHTML(p)}</div></div>${esc(p.name)}</button>`; }).join('')}</div>`;
  if (!demo && !hasFeed) h += '<div class="note">Berichten en foto’s plaatsen vraagt een extra stap: voer <b>supabase-feed.sql</b> uit in Supabase.</div>';
  const items = feedItems();
  h += items.map(it => {
    const k = it.key, n = likeCount(k), on = liked(k), time = ago(it.t);
    const who = it.b ? `${lnkP(it.a)} &amp; ${lnkP(it.b)}` : lnkP(it.a);
    const head = (sub) => `<div class="ph" style="--c:${it.a.color}"><a class="av" href="index.html#persoon=${it.a.id}">${avHTML(it.a)}</a><div class="who">${who}<small>${sub}</small></div>${it.kind === 'post' && it.a.id === meId ? `<button class="more" data-del="${k}" aria-label="Verwijder">···</button>` : ''}</div>`;
    const act = `<div class="act"><button class="like ${on ? 'on' : ''}" data-like="${k}" aria-pressed="${on}">${heart}<span>${n || ''}</span></button></div>`;
    if (it.kind === 'ev') {
      const dn = it.c.status === 'done', pl = !!it.b, side = it.c.side === 'all' ? '' : ` (${it.c.side === 'odd' ? 'oneven' : 'even'} kant)`;
      const txt = dn ? `${pl ? 'hebben' : 'heeft'} ${lnkStreet(it.s)}${side} gedaan` : it.c.status === 'busy' ? `${pl ? 'zijn' : 'is'} bezig in ${lnkStreet(it.s)}${side}` : `${lnkStreet(it.s)}${side} is gepland`;
      return `<article class="post" style="--c:${it.a.color}">${head(time)}<p class="pb">${txt}</p><span class="badge ${dn ? '' : 'dashed'}" style="--c:${it.a.color}"><i></i>${dn ? 'Gedaan' : it.c.status === 'busy' ? 'Bezig' : 'Gepland'}</span>${act}</article>`;
    }
    const p = it.p;
    return `<article class="post" style="--c:${it.a.color}">${head(time + (p.is_story ? ' · verhaal' : '') + (it.s ? ' · ' + esc(it.s.name) : ''))}${p.body ? `<p class="pb">${esc(p.body)}</p>` : ''}${p.photo_url ? `<img class="pimg" src="${esc(p.photo_url)}" alt="" loading="lazy">` : ''}${it.s ? `<span class="badge" style="--c:${it.a.color}"><i></i>${lnkStreet(it.s)}</span>` : ''}${act}</article>`;
  }).join('') || '<div class="empty">Nog niets te zien. Duid een straat aan of plaats het eerste bericht.</div>';
  return h;
}

/* ---------- ranglijst ---------- */
function rang() {
  const { rows } = stats(), key = r => metric === 'km' ? r.len : r.n;
  const sorted = rows.filter(r => r.n || r.b).sort((a, b) => key(b) - key(a) || a.p.name.localeCompare(b.p.name)), max = Math.max(1, ...sorted.map(key));
  const val = r => metric === 'km' ? (r.len / 1000).toFixed(1).replace('.', ',') : r.n, unit = metric === 'km' ? 'km' : 'straten';
  return `<div class="chips"><button class="chip" data-m="km" aria-pressed="${metric === 'km'}">Kilometers</button><button class="chip" data-m="n" aria-pressed="${metric === 'n'}">Aantal straten</button></div>` +
    (sorted.map((r, i) => `<div class="rank ${r.p.id === meId ? 'me' : ''}" style="--c:${r.p.color}"><span class="n ${i < 3 ? 'm' + (i + 1) : ''}">${i + 1}</span><a class="av" href="index.html#persoon=${r.p.id}" style="text-decoration:none">${avHTML(r.p)}</a><div class="m"><b>${esc(r.p.name)}</b><div class="bar"><i style="width:${key(r) / max * 100}%"></i></div></div><div class="v">${val(r)}<small>${unit}${r.b ? ' · ' + r.b + ' bezig' : ''}</small></div></div>`).join('') || '<div class="empty">Nog niemand aan de slag.</div>');
}
function buurt() {
  const groups = new Map(); for (const s of STREETS) { const l = s.name[0].toUpperCase(); (groups.get(l) || groups.set(l, []).get(l)).push(s); }
  return [...groups].sort(([a], [b]) => a.localeCompare(b, 'nl')).map(([l, list]) => {
    const cnt = { done: 0, busy: 0 }; list.forEach(s => { const { st } = stateOf(s.id); if (st !== 'none') cnt[st]++; }); const w = k => cnt[k] / list.length * 100;
    return `<div class="card"><h3>${l}<small>${cnt.done} van ${list.length} gedaan</small></h3><div class="stack"><i style="width:${w('done')}%;background:#272727"></i><i style="width:${w('busy')}%;background:#9a9387"></i></div></div>`; }).join('');
}
function render(anim) {
  hero(); const m = $('main'), y = scrollY; m.innerHTML = `<div class="${anim ? 'view' : ''}">${tab === 'feed' ? feed() : tab === 'rang' ? rang() : buurt()}</div>`; if (!anim) scrollTo(0, y);
  $('seg').style.setProperty('--i', ['feed', 'rang', 'buurt'].indexOf(tab));
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === tab));
  $('fab').style.display = tab === 'feed' ? '' : 'none';
}

/* ---------- acties ---------- */
async function toggleLike(t, btn) {
  if (!me()) return toast('Kies eerst wie je bent in de app');
  const on = liked(t);
  if (on) likes = likes.filter(l => !(l.target === t && l.person_id === meId)); else likes.push({ target: t, person_id: meId });
  btn.classList.toggle('on', !on); btn.setAttribute('aria-pressed', !on); btn.querySelector('span').textContent = likeCount(t) || ''; if (!on) { btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); }
  if (!sb) return;
  const r = on ? await sb.from('feed_likes').delete().eq('target', t).eq('person_id', meId) : await sb.from('feed_likes').insert({ target: t, person_id: meId });
  if (r.error) { toast('Kon het hartje niet opslaan'); window.__reload(); }
}
async function shrink(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }), k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); return new Promise(r => c.toBlob(r, 'image/jpeg', .82));
}
function who() {
  return new Promise(res => { const d = $('dlg'); d.innerHTML = `<h2>Wie ben jij?</h2>${people.map(p => `<button class="rank" data-pp="${p.id}" style="--c:${p.color};width:100%;text-align:left"><div class="av">${avHTML(p)}</div><div class="m"><b>${esc(p.name)}</b></div></button>`).join('')}`; d.showModal(); let out = null; d.onclose = () => res(out); d.onclick = e => { const b = e.target.closest('[data-pp]'); if (b) { out = b.dataset.pp; d.close(); } else if (e.target === d) d.close(); }; });
}
async function ensureMe() {
  if (me()) return true;
  if (session) { toast('Maak eerst een profiel in de app'); return false; }
  if (!sb && !demo) return false;
  if (!people.length) return false;
  const id = await who(); if (!id) return false; meId = id; localStorage.setItem(demo ? 'pb-me-demo' : 'pb-me', id); render(); return true;
}
async function compose(asStory) {
  if (!(await ensureMe())) return;
  if (!demo && !hasFeed) return toast('Voer eerst supabase-feed.sql uit');
  const d = $('dlg'); let file = null, story = !!asStory, prevUrl = null;
  const draw = () => { const keep = d.querySelector('textarea')?.value || '', st = d.querySelector('select')?.value || '';
    d.innerHTML = `<h2>${story ? 'Nieuw verhaal' : 'Nieuw bericht'}</h2><textarea id="tx" rows="3" placeholder="${story ? 'Wat gebeurt er nu? (optioneel)' : 'Deel iets met de groep…'}">${esc(keep)}</textarea>
      ${prevUrl ? `<img class="prev" src="${prevUrl}" alt="">` : ''}
      <div class="rw"><button class="pickb" data-d="photo">${file ? 'Andere foto' : 'Foto toevoegen'}</button></div>
      <div class="rw"><select id="st"><option value="">Bij een straat? (optioneel)</option>${STREETS.map(s => `<option value="${s.id}" ${st === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="sw"><span>Als verhaal (24 uur zichtbaar)</span><button class="tg ${story ? 'on' : ''}" data-d="story" aria-label="Verhaal"></button></div>
      <button class="btn" data-d="go">Plaatsen</button><button class="btn g" style="margin-top:8px" data-d="no">Annuleer</button>`; };
  draw(); d.showModal();
  d.onclick = async e => { const t = e.target.closest('[data-d]')?.dataset.d; if (!t) { if (e.target === d) d.close(); return; }
    if (t === 'no') return d.close();
    if (t === 'story') { story = !story; return draw(); }
    if (t === 'photo') { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.onchange = async () => { const f = i.files[0]; if (!f) return; file = await shrink(f); prevUrl = URL.createObjectURL(file); draw(); }; i.click(); return; }
    if (t === 'go') {
      const body = $('tx').value.trim(), street = $('st').value || null; if (!body && !file) return $('tx').focus();
      const btn = e.target.closest('[data-d=go]'); btn.disabled = true; btn.textContent = 'Bezig met plaatsen…';
      try {
        let url = null;
        if (file) { if (demo) url = await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(file); }); else { const path = (crypto.randomUUID?.() || Date.now()) + '.jpg', up = await sb.storage.from('posts').upload(path, file, { contentType: 'image/jpeg', cacheControl: '31536000' }); if (up.error) throw up.error; url = sb.storage.from('posts').getPublicUrl(path).data.publicUrl; } }
        const row = { person_id: meId, street_id: street, body: body || null, photo_url: url, is_story: story };
        if (demo) posts.unshift({ id: 'd' + Date.now(), ...row, created_at: new Date().toISOString() }); else { const r = await sb.from('feed_posts').insert(row); if (r.error) throw r.error; await window.__reload(); }
        d.close(); render(); toast(story ? 'Verhaal geplaatst' : 'Bericht geplaatst');
      } catch (err) { console.error(err); btn.disabled = false; btn.textContent = 'Plaatsen'; toast('Plaatsen mislukt: ' + (err.message || err)); }
    } };
}
/* ---------- verhalen bekijken ---------- */
let sv = null;
function openStory(personId) {
  const list = stories().get(personId); if (!list) return; sv = { list, i: Math.max(0, list.findIndex(x => !seen.has(x.id))), t: null }; $('story').classList.add('on'); showStory();
}
function showStory() {
  const { list, i } = sv, p = list[i], a = pid(p.person_id), el = $('story'), s = p.street_id && byId.get(p.street_id); clearTimeout(sv.t);
  seen.add(p.id); localStorage.setItem('pb-seen', JSON.stringify([...seen]));
  el.innerHTML = `<div class="bars">${list.map((_, k) => `<i class="${k < i ? 'd' : ''}"><b style="${k === i ? 'transition:width 5s linear;width:0' : ''}"></b></i>`).join('')}</div>
    <div class="top"><div class="av" style="--c:${a.color}">${avHTML(a)}</div><div><b>${esc(a.name)}</b><small>${ago(+new Date(p.created_at))}${s ? ' · ' + esc(s.name) : ''}</small></div><button data-sv="x" aria-label="Sluiten">×</button></div>
    <div class="body">${p.photo_url ? `<img src="${esc(p.photo_url)}" alt="">` : `<div class="txtonly">${esc(p.body || '')}</div>`}${p.photo_url && p.body ? `<div class="cap">${esc(p.body)}</div>` : ''}<div class="tap"><div data-sv="p"></div><div data-sv="n"></div></div></div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => { const b = el.querySelectorAll('.bars i')[i]?.firstChild; if (b) b.style.width = '100%'; }));
  sv.t = setTimeout(() => nextStory(1), 5000);
}
function nextStory(d) { const j = sv.i + d; if (j < 0) return showStory(); if (j >= sv.list.length) return closeStory(); sv.i = j; showStory(); }
function closeStory() { clearTimeout(sv?.t); $('story').classList.remove('on'); sv = null; render(); }

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-t],[data-m],[data-like],[data-a],[data-del],[data-story-of],[data-sv]'); if (!t) return; const D = t.dataset;
  if (D.t) { if (D.t !== tab) { tab = D.t; render(true); scrollTo(0, 0); } return; }
  if (D.m) { metric = D.m; render(); return; }
  if (D.like) return toggleLike(D.like, t);
  if (D.a === 'compose') return compose(!!D.story);
  if (D.storyOf) return openStory(D.storyOf);
  if (D.sv) { if (D.sv === 'x') return closeStory(); return nextStory(D.sv === 'n' ? 1 : -1); }
  if (D.del) { if (!confirm('Dit bericht verwijderen?')) return; if (demo) posts = posts.filter(p => p.id !== D.del); else { const r = await sb.from('feed_posts').delete().eq('id', D.del); if (r.error) return toast('Verwijderen mislukt'); await window.__reload(); } render(); }
});
$('fab').addEventListener('click', () => compose(false));
render(true);
})();
</script>

</body>
