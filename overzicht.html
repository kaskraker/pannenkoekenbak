<html lang="nl">

<title>Feed · Pannenkoekenverkoop Ingelmunster</title>

<style>
:root{--bone:#F4F1EB;--pagina:#FAF8F4;--kaart:#EFEAE1;--lijn:#D5CCBF;--donker:#272727;--tekst:#3c3c3b;--zacht:#6f695d;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:linear-gradient(180deg,#3d3d3d,#242424);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 8px rgba(39,39,39,.28);transform:translateX(calc(var(--i,0) * 100%));transition:transform .5s var(--spb)}

.act{display:flex;gap:6px;margin:4px -4px 0;color:var(--zacht)}
.like{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;font-weight:700;font-size:14px;transition:transform .5s var(--spb),background .2s}

dialog{border:0;border-radius:28px;padding:20px;width:min(440px,calc(100% - 20px));background:rgba(252,250,247,.98);box-shadow:var(--glow),var(--edge),0 24px 60px rgba(39,39,39,.3);color:var(--tekst);font:inherit}

<body>
<div class="wrap">
  <div class="head"><a href="index.html" aria-label="Terug naar de kaart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><h1>Feed<small>Pannenkoekenverkoop Ingelmunster</small></h1></div>
  <div class="hero" id="hero"></div>
  <div class="seg" id="seg" style="--i:0"><button data-t="feed" aria-selected="true">Feed</button><button data-t="rang" aria-selected="false">Ranglijst</button></div>
  <div id="main"></div>
</div>
<button class="fab" id="fab" aria-label="Nieuw bericht"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>
<div class="lb" id="lb"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(async () => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg = window.PANNENKOEK_CONFIG || {}, demo = location.search.includes('demo') || !(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY);
const STREETS = await (await fetch('data/streets.json')).json(), byId = new Map(STREETS.map(s => [s.id, s])), TOTAL = STREETS.reduce((a, s) => a + s.len, 0);
const km = m => (m / 1000).toFixed(1).replace('.', ',') + ' km', initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
let comments = [], hasComments = true, open_ = new Set(), people = [], claims = [], posts = [], likes = [], tab = 'feed', metric = 'km', shown = null, meId = null, hasFeed = true, sb = null, session = null;
const seen = new Set(JSON.parse(localStorage.getItem('pb-seen') || '[]'));

/* ---------- gegevens ---------- */
const photoOf = (c, k) => c;
if (demo) {
  const nm = ['Patrick', 'Anja', 'Lien', 'Sander', 'Marie', 'Tom', 'Eline', 'Bram'], col = ['#BA0C2F', '#3B5BDB', '#E8A300', '#2E9E5B', '#00A6B8', '#8A5A2B', '#F26B21', '#2B2B2B'];
  people = nm.map((n, i) => ({ id: 'p' + i, name: n, color: col[i] }));
  STREETS.slice(0, 120).forEach((s, i) => { if (i % 3 === 2) return; claims.push({ street_id: s.id, side: 'all', person_id: 'p' + ((i * 7) % 8), partner_id: null, status: ['done', 'done', 'busy', 'assigned'][i % 4], done_at: new Date(Date.now() - ((i * 5) % 9) * 864e5 - (i % 6) * 36e5).toISOString() }); });
  const g = (a, b) => { const c = document.createElement('canvas'); c.width = 600; c.height = 450; const x = c.getContext('2d'), gr = x.createLinearGradient(0, 0, 600, 450); gr.addColorStop(0, a); gr.addColorStop(1, b); x.fillStyle = gr; x.fillRect(0, 0, 600, 450); x.fillStyle = 'rgba(255,255,255,.9)'; x.font = '700 64px system-ui'; x.textAlign = 'center'; x.fillText('Pannenkoeken!', 300, 240); return c.toDataURL('image/jpeg', .8); };
  const ago_ = m => new Date(Date.now() - m * 6e4).toISOString(), P = n => 'assets/demo/' + n + '.jpg';
  posts = [
    { id: 'x1', person_id: 'p2', street_id: STREETS[4].id, body: 'Eerste ronde gedaan, wat een leuke buurt! Iedereen was thuis en de pannenkoeken vlogen weg.', photo_url: P('p5'), is_story: false, created_at: ago_(40) },
    { id: 'x2', person_id: 'p0', street_id: null, body: 'Vergeet je lijst niet in te vullen en terug te brengen, mensen. Nog 23 dagen tot de voorbak!', photo_url: null, is_story: false, created_at: ago_(190) },
    { id: 'x3', person_id: 'p3', street_id: STREETS[9].id, body: 'Proefbak voor de voorbak. Het beslag is perfect, dit gaat smaken!', photo_url: P('p6'), is_story: false, created_at: ago_(75) },
    { id: 'x5', person_id: 'p4', street_id: STREETS[14].id, body: 'Twee uur rondgeweest, 14 bestellingen. Vooral veel kilo’s deze keer.', photo_url: null, is_story: false, created_at: ago_(300) },
    { id: 'x6', person_id: 'p5', street_id: null, body: 'Koffiepauze in de keuken voor de volgende ronde', photo_url: P('p3'), is_story: false, created_at: ago_(1500) },
  ];
  posts.push({ id: 'x4', person_id: claims[0].person_id, street_id: claims[0].street_id, body: null, photo_url: 'assets/demo/p3.jpg', is_story: false, created_at: new Date(Date.now() + 1000).toISOString() });
  comments = [{ id: 'c1', target: 'x1', person_id: 'p0', body: 'Top gedaan, Lien!', created_at: new Date(Date.now() - 30 * 6e4).toISOString() }, { id: 'c2', target: 'x1', person_id: 'p3', body: 'Waar was die koffiepauze dan?', created_at: new Date(Date.now() - 10 * 6e4).toISOString() }];
  comments.push({ id: 'c3', target: 'x3', person_id: 'p1', body: 'Hoeveel kilo beslag heb je gemaakt?', created_at: ago_(50) }, { id: 'c4', target: 'x3', person_id: 'p3', body: 'Zo’n 8 kilo, genoeg voor de hele straat', created_at: ago_(44) });
  likes = [{ target: 'x1', person_id: 'p0' }, { target: 'x1', person_id: 'p3' }, { target: 'x3', person_id: 'p0' }, { target: 'x3', person_id: 'p1' }, { target: 'x3', person_id: 'p2' }, { target: 'x6', person_id: 'p4' }];
  meId = localStorage.getItem('pb-me-demo') || 'p0';
} else {
  sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: true, detectSessionInUrl: true } });
  const load = async () => {
    const [p, d, f, l, cm] = await Promise.all([sb.from('people').select('*'), sb.from('done_streets').select('*'), sb.from('feed_posts').select('*').order('created_at', { ascending: false }).limit(120), sb.from('feed_likes').select('*'), sb.from('feed_comments').select('*').order('created_at')]);
    if (p.error || d.error) throw (p.error || d.error);
    people = p.data; claims = d.data.map(c => ({ ...c, side: c.side || 'all', status: c.status || 'done' }));
    hasFeed = !f.error; posts = f.data || []; likes = l.data || []; hasComments = !cm.error; comments = cm.data || [];
    try { const { data } = await sb.auth.getSession(); session = data.session; } catch {}
    const lm = localStorage.getItem('pb-me');
    meId = session ? (people.find(x => x.user_id === session.user.id)?.id || null) : (lm && people.some(x => x.id === lm) ? lm : null);
  };
  await load().catch(() => { $('main').innerHTML = '<div class="empty">Kan de gegevens niet laden.</div>'; });
  window.__reload = async () => { await load(); if (document.activeElement?.classList.contains('cin') && document.activeElement.value) return; render(); };
  sb.channel('ov').on('postgres_changes', { event: '*', schema: 'public' }, () => window.__reload()).subscribe();
}
const pid = id => people.find(p => p.id === id), me = () => pid(meId);
const avHTML = p => p.photo_url ? `<img src="${esc(p.photo_url)}" alt="">` : esc(initials(p.name));
const ago = t => { const d = (Date.now() - t) / 6e4; return d < 1 ? 'zonet' : d < 60 ? Math.round(d) + ' min geleden' : d < 1440 ? Math.round(d / 60) + ' u geleden' : d < 2880 ? 'gisteren' : new Date(t).toLocaleDateString('nl-BE', { day: 'numeric', month: 'long' }); };
let toastT; const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); };

/* ---------- cijfers ---------- */
function stateOf(id) { const cs = claims.filter(c => c.street_id === id); if (!cs.length) return { st: 'none', cs }; const dn = cs.find(c => c.status === 'done'); return { st: dn ? 'done' : 'busy', cs }; }
function stats() {
  const m = new Map(people.map(p => [p.id, { p, n: 0, len: 0, b: 0 }])); let n = 0, len = 0;
  for (const s of STREETS) { const { st, cs } = stateOf(s.id); if (st === 'done') { n++; len += s.len; } const k = new Set();
    for (const c of cs) for (const id of [c.person_id, c.partner_id]) { const r = id && m.get(id); if (!r || k.has(id + c.status)) continue; k.add(id + c.status); if (c.status === 'done') { r.n++; r.len += s.len; } else r.b++; } }
  return { n, len, rows: [...m.values()] };
}
function hero() {
  const { n, len } = stats(), pct = Math.round(len / TOTAL * 100), from = shown ?? pct; shown = pct; const left = STREETS.length - n;
  const chip = (d, l, when) => `<span class="cdc"><b>${d > 0 ? d : d === 0 ? 'vandaag' : '✓'}</b>${d > 0 ? (d === 1 ? ' dag' : ' dagen') : ''} <small>${l} · ${when}</small></span>`;
  $('hero').innerHTML = `<div class="hr1"><div class="ring"><svg viewBox="0 0 36 36"><circle class="tr" cx="18" cy="18" r="15.9155"/><circle class="pr" cx="18" cy="18" r="15.9155" pathLength="100" stroke-dasharray="${from} 100"/></svg><b>${pct}%</b></div><div class="t"><b>${n} van ${STREETS.length} straten gedaan</b><span>${km(len)} · nog ${left} te doen</span></div></div><div class="hr2">${chip(dagen(11, 16), 'voorbak', '16 dec')}${chip(dagen(11, 28), 'bak', '28–29 dec')}</div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => $('hero').querySelector('.pr')?.setAttribute('stroke-dasharray', pct + ' 100')));
}
/* ---------- feed ---------- */
const likeCount = t => likes.filter(l => l.target === t).length, liked = t => likes.some(l => l.target === t && l.person_id === meId);
const heart = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.700 3.700 4.500 7 4.500c1.900 0 3.400 1 5 3 1.600-2 3.100-3 5-3 3.300 0 5.400 3.200 4.200 6.600-1.700 4.800-9.200 9.400-9.200 9.400z"/></svg>';
const lnkStreet = s => `<a href="index.html#straat=${s.id}" data-go="straat:${s.id}">${esc(s.name)}</a>`, lnkP = p => `<a href="index.html#persoon=${p.id}" data-go="persoon:${p.id}">${esc(p.name)}</a>`;
function feedItems() {
  const items = [];
  for (const c of claims) { const s = byId.get(c.street_id), a = pid(c.person_id); if (!s || !a) continue; items.push({ kind: 'ev', key: `ev:${c.street_id}:${c.side}:${c.status}`, t: +new Date(c.done_at), a, b: c.partner_id && pid(c.partner_id), s, c }); }
  const used = new Set();
  for (const it of items) { const ph = posts.filter(p => !used.has(p.id) && p.street_id === it.c.street_id && p.person_id === it.c.person_id && !p.body && p.photo_url && +new Date(p.created_at) >= it.t - 6e4).sort((x, y) => +new Date(x.created_at) - +new Date(y.created_at))[0]; if (ph) { used.add(ph.id); it.photo = ph; } }
  for (const p of posts) { const a = pid(p.person_id); if (!a || used.has(p.id)) continue; items.push({ kind: 'post', key: p.id, t: +new Date(p.created_at), a, s: p.street_id && byId.get(p.street_id), p }); }
  return items.sort((x, y) => y.t - x.t).slice(0, 80);
}
const stories = () => { const lim = Date.now() - 864e5, by = new Map(); for (const p of posts) if (p.is_story && +new Date(p.created_at) > lim && pid(p.person_id)) (by.get(p.person_id) || by.set(p.person_id, []).get(p.person_id)).push(p); for (const l of by.values()) l.sort((a, b) => +new Date(a.created_at) - +new Date(b.created_at)); return by; };
const dagen = (m, d) => { const t = new Date(new Date().getFullYear(), m, d); t.setHours(0, 0, 0, 0); const n = new Date(); n.setHours(0, 0, 0, 0); return Math.round((t - n) / 864e5); };
function aftellers() { return ''; }
function itemHTML(it) {
    const k = it.key, n = likeCount(k), on = liked(k), time = ago(it.t);
    const who = it.b ? `${lnkP(it.a)} &amp; ${lnkP(it.b)}` : lnkP(it.a);
    const head = (sub) => `<div class="ph" style="--c:${it.a.color}"><a class="av" href="index.html#persoon=${it.a.id}" data-go="persoon:${it.a.id}">${avHTML(it.a)}</a><div class="who">${who}<small>${sub}</small></div>${(it.kind === 'post' || it.photo) && it.a.id === meId ? `<button class="more" data-del="${it.kind === 'post' ? k : it.photo.id}" aria-label="Verwijder">···</button>` : ''}</div>`;
    const cs = comments.filter(c => c.target === k), openT = open_.has(k);
    const act = `<div class="act"><button class="like ${on ? 'on' : ''}" data-like="${k}" aria-pressed="${on}">${heart}<span>${n || ''}</span></button>${hasComments || demo ? `<button class="like" data-cm="${k}" aria-expanded="${openT}"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.600 7.100L4 20.500l1.400-4.600A8 8 0 1 1 21 12z"/></svg><span>${cs.length || ''}</span></button>` : ''}</div>${openT ? `<div class="cm">${cs.map(c => { const a = pid(c.person_id); return a ? `<div class="c"><a class="av" href="index.html#persoon=${a.id}" data-go="persoon:${a.id}" style="--c:${a.color}">${avHTML(a)}</a><div class="cb"><b>${esc(a.name)}</b> <span>${esc(c.body)}</span><small>${ago(+new Date(c.created_at))}${c.person_id === meId ? ' · <button data-cdel="' + c.id + '">verwijder</button>' : ''}</small></div></div>` : ''; }).join('')}<form class="cf" data-cf="${k}"><input class="cin" maxlength="600" placeholder="Schrijf een reactie…" autocomplete="off" enterkeyhint="send"><button type="submit" aria-label="Verstuur"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form></div>` : ''}`;
    if (it.kind === 'ev') {
      const dn = it.c.status === 'done', pl = !!it.b, side = it.c.side === 'all' ? '' : ` (${it.c.side === 'odd' ? 'oneven' : 'even'} kant)`;
      const txt = dn ? `${pl ? 'hebben' : 'heeft'} ${lnkStreet(it.s)}${side} gedaan` : it.c.status === 'busy' ? `${pl ? 'zijn' : 'is'} bezig in ${lnkStreet(it.s)}${side}` : `${lnkStreet(it.s)}${side} is gepland`;
      return `<article class="post" data-k="${k}" style="--c:${it.a.color}">${head(time)}<p class="pb">${txt}</p>${it.photo ? `<img class="pimg" data-lb="${k}" src="${esc(it.photo.photo_url)}" alt="" loading="lazy">` : ''}<span class="badge ${dn ? '' : 'dashed'}" style="--c:${it.a.color}"><i></i>${dn ? 'Gedaan' : it.c.status === 'busy' ? 'Bezig' : 'Gepland'}</span>${act}</article>`;
    }
    const p = it.p;
    return `<article class="post" data-k="${k}" style="--c:${it.a.color}">${head(time + (it.s ? ' · ' + esc(it.s.name) : ''))}${p.body ? `<p class="pb">${esc(p.body)}</p>` : ''}${p.photo_url ? `<img class="pimg" data-lb="${k}" src="${esc(p.photo_url)}" alt="" loading="lazy">` : ''}${it.s ? `<span class="badge" style="--c:${it.a.color}"><i></i>${lnkStreet(it.s)}</span>` : ''}${act}</article>`;
}
function rerenderPost(k) {
  const el = document.querySelector(`article[data-k="${k}"]`), it = feedItems().find(i => i.key === k); if (!el || !it) return;
  const y = scrollY, h0 = el.offsetHeight; el.outerHTML = itemHTML(it); const n = document.querySelector(`article[data-k="${k}"]`);
  if (n) { const cm = n.querySelector('.cm'); if (cm) cm.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' }); }
  scrollTo(0, y);
}
function feed() {
  let h = aftellers();
  const mp = me();
  h += `<div class="compose"><div class="cav" style="--c:${mp ? mp.color : '#bbb'}">${mp ? avHTML(mp) : '?'}</div><button class="cin2" data-a="compose">Deel iets met de groep…</button><button class="cph" data-a="compose" data-photo="1" aria-label="Foto delen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button></div>`;
  if (!demo && !hasFeed) h += '<div class="note">Berichten en foto’s plaatsen vraagt een extra stap: voer <b>supabase-feed.sql</b> uit in Supabase.</div>';
  const items = feedItems();
  h += items.map(itemHTML).join('') || '<div class="empty">Nog niets te zien. Duid een straat aan of plaats het eerste bericht.</div>';
  return h;
}

/* ---------- ranglijst ---------- */
function rang() {
  const { rows } = stats(), key = r => metric === 'km' ? r.len : r.n;
  const sorted = rows.filter(r => r.n || r.b).sort((a, b) => key(b) - key(a) || a.p.name.localeCompare(b.p.name)), max = Math.max(1, ...sorted.map(key));
  const val = r => metric === 'km' ? (r.len / 1000).toFixed(1).replace('.', ',') : r.n, unit = metric === 'km' ? 'km' : 'straten';
  return `<div class="chips"><button class="chip" data-m="km" aria-pressed="${metric === 'km'}">Kilometers</button><button class="chip" data-m="n" aria-pressed="${metric === 'n'}">Aantal straten</button></div>` +
    (sorted.map((r, i) => `<div class="rank ${r.p.id === meId ? 'me' : ''}" style="--c:${r.p.color}"><span class="n ${i < 3 ? 'm' + (i + 1) : ''}">${i + 1}</span><a class="av" href="index.html#persoon=${r.p.id}" data-go="persoon:${r.p.id}" style="text-decoration:none">${avHTML(r.p)}</a><div class="m"><b>${esc(r.p.name)}</b><div class="bar"><i style="width:${key(r) / max * 100}%"></i></div></div><div class="v">${val(r)}<small>${unit}${r.b ? ' · ' + r.b + ' bezig' : ''}</small></div></div>`).join('') || '<div class="empty">Nog niemand aan de slag.</div>');
}
function buurt() {
  const groups = new Map(); for (const s of STREETS) { const l = s.name[0].toUpperCase(); (groups.get(l) || groups.set(l, []).get(l)).push(s); }
  return [...groups].sort(([a], [b]) => a.localeCompare(b, 'nl')).map(([l, list]) => {
    const cnt = { done: 0, busy: 0 }; list.forEach(s => { const { st } = stateOf(s.id); if (st !== 'none') cnt[st]++; }); const w = k => cnt[k] / list.length * 100;
    return `<div class="card"><h3>${l}<small>${cnt.done} van ${list.length} gedaan</small></h3><div class="stack"><i style="width:${w('done')}%;background:#272727"></i><i style="width:${w('busy')}%;background:#9a9387"></i></div></div>`; }).join('');
}
function render(anim) {
  document.querySelector('.head h1').firstChild.nodeValue = tab === 'rang' ? 'Ranglijst' : 'Feed'; hero(); const m = $('main'), y = scrollY; m.innerHTML = `<div class="${anim ? 'view' : ''}">${tab === 'feed' ? feed() : rang()}</div>`; if (!anim) scrollTo(0, y);
  $('seg').style.setProperty('--i', ['feed', 'rang'].indexOf(tab));
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === tab));
  $('fab').style.display = tab === 'feed' ? '' : 'none';
}

/* ---------- acties ---------- */
async function toggleLike(t, btn) {

  const r = on ? await sb.from('feed_likes').delete().eq('target', t).eq('person_id', meId) : await sb.from('feed_likes').insert({ target: t, person_id: meId });

}

}
function who() {

async function ensureMe() {

}
async function compose(startPhoto) {

}
/* ---------- foto vergroten: de foto groeit vanuit zijn plek in de feed ---------- */
const EASE = 'cubic-bezier(.2,.8,.2,1)';
let lbThumb = null, lbBusy = false;
function morph(img, T, F, r) {                           // transformatie die de grote foto precies over de uitsnede in de feed legt
  const sc = Math.max(T.width / F.width, T.height / F.height), wl = T.width / sc, hl = T.height / sc;
  const tx = (F.width - wl) / 2, ty = (F.height - hl) / 2;
  return { transform: `translate(${T.left + T.width / 2 - (F.left + F.width / 2)}px,${T.top + T.height / 2 - (F.top + F.height / 2)}px) scale(${sc})`, clipPath: `inset(${ty}px ${tx}px ${ty}px ${tx}px round ${r / sc}px)` };
}
async function openLb(k) {

  const on = liked(k), n = likeCount(k), cn = comments.filter(c => c.target === k).length;
  lb.innerHTML = `<button class="lbx" data-lbx="1" aria-label="Sluiten">×</button><div class="lbi"><img src="${esc(url)}" alt="" draggable="false"></div><div class="lbb"><div><b>${esc(it.a.name)}</b>${it.s ? ' · ' + esc(it.s.name) : ''}${it.p?.body ? `<p>${esc(it.p.body)}</p>` : ''}</div><div class="lba"><button class="like ${on ? 'on' : ''}" data-lblike="${k}" aria-pressed="${on}">${heart}<span>${n || ''}</span></button><button class="like" data-lbcm="${k}"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.600 7.100L4 20.500l1.400-4.600A8 8 0 1 1 21 12z"/></svg><span>${cn || ''}</span></button></div></div>`;
  lb.classList.add('on'); document.documentElement.style.overflow = 'hidden';
  const img = lb.querySelector('img'); try { await img.decode(); } catch {}
  const F = img.getBoundingClientRect(), T = thumb.getBoundingClientRect(), ui = lb.querySelectorAll('.lbx,.lbb');
  lb.style.background = 'rgba(8,8,8,.985)';
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {

    lb.animate([{ background: 'rgba(8,8,8,0)' }, { background: 'rgba(8,8,8,.985)' }], { duration: 380, easing: 'ease-out' });
    ui.forEach(u => u.animate([{ opacity: 0 }, { opacity: 0, offset: .45 }, { opacity: 1 }], { duration: 520, easing: 'ease-out' }));
    await img.animate([m, { transform: 'none', clipPath: 'inset(0px 0px 0px 0px round 0px)' }], { duration: 470, easing: EASE }).finished.catch(() => {});
  }

}
function attachDrag(img) {
  const lb = $('lb'); let y0 = null, dy = 0, t0 = 0;
  img.onpointerdown = e => { if (e.pointerType === 'mouse' && e.button) return; y0 = e.clientY; dy = 0; t0 = performance.now(); img.setPointerCapture(e.pointerId); img.style.transition = 'none'; };
  img.onpointermove = e => { if (y0 === null) return; dy = e.clientY - y0; const k = Math.min(1, Math.abs(dy) / 420); img.style.transform = `translateY(${dy}px) scale(${1 - k * .22})`; lb.style.background = `rgba(8,8,8,${.985 * (1 - k * .9)})`; lb.querySelectorAll('.lbx,.lbb').forEach(u => u.style.opacity = 1 - Math.min(1, Math.abs(dy) / 120)); };
  img.onpointerup = img.onpointercancel = e => {
    if (y0 === null) return; const fast = Math.abs(dy) / Math.max(1, performance.now() - t0) > .6; y0 = null;
    if (Math.abs(dy) > 110 || (fast && Math.abs(dy) > 30)) return closeLb(true);
    img.style.transition = 'transform .45s ' + EASE; img.style.transform = ''; lb.style.transition = 'background .45s'; lb.style.background = 'rgba(8,8,8,.985)'; lb.querySelectorAll('.lbx,.lbb').forEach(u => u.style.opacity = '');
    setTimeout(() => { img.style.transition = ''; lb.style.transition = ''; }, 480);
  };
}
async function closeLb(fromDrag) {
  const lb = $('lb'), k = lb.dataset.k; if (!lb.classList.contains('on') || lbBusy) return; lbBusy = true;
  const img = lb.querySelector('img'), thumb = document.querySelector(`article[data-k="${k}"] .pimg`) || lbThumb, ui = lb.querySelectorAll('.lbx,.lbb');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

document.addEventListener('submit', async e => {

});
$('fab').addEventListener('click', () => compose(false));
$('lb').addEventListener('click', e => { if (e.target === $('lb') || e.target.classList.contains('lbi')) closeLb(false); });

const EMBED = window.top !== window.self;
