<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EB">
<title>Overzicht · Pannenkoekenverkoop Ingelmunster</title>
<link rel="icon" href="assets/symbool.png">
<style>
:root{--bone:#F4F1EB;--pagina:#FAF8F4;--kaart:#EFEAE1;--lijn:#D5CCBF;--donker:#272727;--tekst:#3c3c3b;--zacht:#6f695d;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --glow:inset 0 1px 0 rgba(255,255,255,.85);--edge:inset 0 0 0 1px rgba(39,39,39,.06);--sh:0 1px 2px rgba(39,39,39,.06),0 8px 24px rgba(39,39,39,.1);
  --sp:cubic-bezier(.2,.8,.2,1);--spb:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bone);color:var(--tekst);font:500 15.5px/1.42 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;gap:12px;margin:6px 2px 16px}
.head a{width:40px;height:40px;border-radius:50%;background:rgba(39,39,39,.06);box-shadow:var(--glow),var(--edge);display:flex;align-items:center;justify-content:center;color:var(--donker);text-decoration:none;flex:none}
.head a svg{width:20px;height:20px}
.head h1{margin:0;font-size:26px;letter-spacing:-.025em;color:var(--donker);line-height:1.1}
.head small{display:block;color:var(--zacht);font-size:14px;font-weight:500;letter-spacing:0}
.hero{display:flex;align-items:center;gap:16px;background:var(--pagina);border-radius:24px;padding:16px 18px;box-shadow:var(--glow),var(--edge),var(--sh);margin-bottom:16px}
.ring{position:relative;width:76px;height:76px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.6;stroke-linecap:round}.ring .tr{stroke:rgba(39,39,39,.08)}.ring .pr{stroke:var(--donker);transition:stroke-dasharray 1.1s var(--sp)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:21px;letter-spacing:-.03em;color:var(--donker);font-variant-numeric:tabular-nums}
.hero .t b{display:block;font-size:19px;color:var(--donker);letter-spacing:-.015em}.hero .t span{color:var(--zacht);font-size:14.5px}
.seg{position:sticky;top:8px;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(244,241,235,.82);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-radius:99px;padding:4px;margin-bottom:16px;box-shadow:var(--edge),var(--sh)}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(25% - 2px);border-radius:99px;background:linear-gradient(180deg,#3d3d3d,#242424);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 8px rgba(39,39,39,.28);transform:translateX(calc(var(--i,0) * 100%));transition:transform .5s var(--spb)}
.seg button{position:relative;padding:9px 0;font-weight:600;font-size:14.5px;color:var(--zacht);transition:color .3s}.seg button[aria-selected=true]{color:#fff}
.view{animation:in .45s var(--sp) both}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;margin:0 -14px;padding-inline:14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:99px;background:rgba(39,39,39,.05);box-shadow:inset 0 0 0 1px rgba(39,39,39,.07);font-weight:600;font-size:14px;transition:transform .5s var(--spb),background .2s}
.chip[aria-pressed=true]{background:linear-gradient(180deg,#3b3b3b,#272727);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 6px rgba(39,39,39,.25)}
.chip:active{transform:scale(.95)}.chip .d{width:10px;height:10px;border-radius:50%}
/* bingo */
.bingo{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.tile{position:relative;aspect-ratio:1;border-radius:16px;padding:7px 7px 6px;display:flex;align-items:flex-end;text-align:left;font-size:11px;line-height:1.15;font-weight:600;letter-spacing:-.01em;overflow:hidden;background:var(--pagina);color:#9a9387;box-shadow:inset 0 0 0 1px rgba(39,39,39,.07);transition:transform .45s var(--spb),opacity .3s;word-break:break-word;hyphens:auto}
.tile:active{transform:scale(.93)}
.tile.done{background:var(--c);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(0,0,0,.08)}
.tile.busy{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--donker);box-shadow:inset 0 0 0 2px var(--c);border:0}
.tile.busy::after{content:"";position:absolute;inset:0;border-radius:16px;border:2.5px dashed var(--c);opacity:.9}
.tile.dim{opacity:.22}
.tile .av{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--c);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.tile .av img{width:100%;height:100%;object-fit:cover}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--zacht);font-size:13.5px;margin:2px 2px 12px}.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
/* podium */
.pod{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:8px;align-items:end;margin:6px 0 20px}
.pod .p{display:flex;flex-direction:column;align-items:center;text-align:center}
.pod .av{width:62px;height:62px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--c),0 8px 18px rgba(39,39,39,.2)}
.pod .p.first .av{width:78px;height:78px;font-size:24px}.pod .av img{width:100%;height:100%;object-fit:cover}
.pod .nm{margin-top:12px;font-weight:700;color:var(--donker);font-size:16px;letter-spacing:-.01em}.pod .sc{color:var(--zacht);font-size:13.5px}
.pod .step{width:100%;margin-top:8px;border-radius:16px 16px 6px 6px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-size:26px;font-weight:800;color:rgba(255,255,255,.95);background:linear-gradient(180deg,#4a4a4a,#272727);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.pod .p.first .step{height:92px}.pod .p.second .step{height:68px;background:linear-gradient(180deg,#6a6a6a,#444)}.pod .p.third .step{height:50px;background:linear-gradient(180deg,#8a8a8a,#5e5e5e)}
.rank{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--pagina);box-shadow:var(--glow),var(--edge);margin-bottom:7px}
.rank .n{width:22px;text-align:center;font-weight:800;color:var(--zacht);font-variant-numeric:tabular-nums}
.rank .av{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c)}.rank .av img{width:100%;height:100%;object-fit:cover}
.rank .m{flex:1;min-width:0}.rank .m b{display:block;color:var(--donker);font-size:16px}.rank .bar{height:6px;border-radius:9px;background:var(--kaart);margin-top:6px;overflow:hidden}.rank .bar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .9s var(--sp)}
.rank .v{font-size:20px;font-weight:800;color:var(--donker);font-variant-numeric:tabular-nums}.rank .v small{display:block;font-size:11.5px;font-weight:600;color:var(--zacht);text-align:right}
/* nieuws */
.count{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:22px;background:linear-gradient(180deg,#3d3d3d,#242424);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),var(--sh);margin-bottom:18px}
.count b{font-size:42px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}.count span{opacity:.75;font-size:15px}
.day{margin:18px 2px 8px;font-size:13.5px;font-weight:700;color:var(--zacht);text-transform:capitalize}
.ev{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--pagina);box-shadow:var(--glow),var(--edge);margin-bottom:7px}
.ev .av{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.ev .av img{width:100%;height:100%;object-fit:cover}
.ev .tx{flex:1;min-width:0;line-height:1.3}.ev .tx b{color:var(--donker)}.ev time{color:var(--zacht);font-size:12.5px;white-space:nowrap}
/* buurten */
.card{background:var(--pagina);border-radius:22px;padding:14px 16px;box-shadow:var(--glow),var(--edge),var(--sh);margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:17px;color:var(--donker);letter-spacing:-.015em;display:flex;justify-content:space-between;align-items:baseline}.card h3 small{font-size:13.5px;color:var(--zacht);font-weight:600}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--kaart);margin:8px 0}.stack i{display:block;height:100%}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,24px);opacity:0;pointer-events:none;background:rgba(34,34,34,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;box-shadow:var(--sh);transition:opacity .25s,transform .5s var(--spb);max-width:calc(100% - 24px);text-align:center;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{padding:40px 10px;text-align:center;color:var(--zacht)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><a href="index.html" aria-label="Terug naar de kaart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><h1>Overzicht<small>Pannenkoekenverkoop Ingelmunster</small></h1></div>
  <div class="hero" id="hero"></div>
  <div class="seg" id="seg" style="--i:0"><button data-t="bingo" aria-selected="true">Bingo</button><button data-t="podium" aria-selected="false">Podium</button><button data-t="nieuws" aria-selected="false">Nieuws</button><button data-t="buurt" aria-selected="false">A–Z</button></div>
  <div id="main"></div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(async () => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg = window.PANNENKOEK_CONFIG || {}, demo = location.search.includes('demo') || !(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY);
const STREETS = await (await fetch('data/streets.json')).json(), byId = new Map(STREETS.map(s => [s.id, s])), TOTAL = STREETS.reduce((a, s) => a + s.len, 0);
const km = m => (m / 1000).toFixed(1).replace('.', ',') + ' km', initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
let people = [], claims = [], tab = 'bingo', who = '', metric = 'km', shown = null;
if (demo) {
  const nm = ['Patrick', 'Anja', 'Lien', 'Sander', 'Marie', 'Tom', 'Eline', 'Bram'], col = ['#BA0C2F', '#3B5BDB', '#E8A300', '#2E9E5B', '#00A6B8', '#8A5A2B', '#F26B21', '#2B2B2B'];
  people = nm.map((n, i) => ({ id: 'p' + i, name: n, color: col[i] }));
  STREETS.slice(0, 120).forEach((s, i) => { if (i % 3 === 2) return; claims.push({ street_id: s.id, side: 'all', person_id: 'p' + ((i * 7) % 8), partner_id: null, status: ['done', 'done', 'busy', 'assigned'][i % 4], done_at: new Date(Date.now() - ((i * 5) % 9) * 864e5 - (i % 6) * 36e5).toISOString() }); });
} else {
  const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  const load = async () => { const [p, d] = await Promise.all([sb.from('people').select('*'), sb.from('done_streets').select('*')]); if (p.error || d.error) throw (p.error || d.error); people = p.data; claims = d.data.map(c => ({ ...c, side: c.side || 'all', status: c.status || 'done' })); };
  await load().catch(e => { $('main').innerHTML = '<div class="empty">Kan de gegevens niet laden.</div>'; });
  sb.channel('ov').on('postgres_changes', { event: '*', schema: 'public' }, async () => { await load(); render(); }).subscribe();
}
const pid = id => people.find(p => p.id === id);
const avHTML = p => p.photo_url ? `<img src="${esc(p.photo_url)}" alt="">` : esc(initials(p.name));
function stateOf(id) { const cs = claims.filter(c => c.street_id === id); if (!cs.length) return { st: 'none' }; const dn = cs.find(c => c.status === 'done'); const c = dn || cs.find(c => c.status === 'busy') || cs[0]; return { st: dn ? 'done' : c.status === 'busy' ? 'busy' : 'plan', c, cs }; }
function stats() {
  const m = new Map(people.map(p => [p.id, { p, n: 0, len: 0, b: 0, last: 0 }]));
  let n = 0, len = 0;
  for (const s of STREETS) { const { st, cs } = stateOf(s.id); if (st === 'done') { n++; len += s.len; } if (!cs) continue; const seen = new Set();
    for (const c of cs) for (const id of [c.person_id, c.partner_id]) { const r = id && m.get(id); if (!r || seen.has(id + c.status)) continue; seen.add(id + c.status); if (c.status === 'done') { r.n++; r.len += s.len; r.last = Math.max(r.last, +new Date(c.done_at)); } else r.b++; } }
  return { n, len, rows: [...m.values()] };
}
function hero() {
  const { n, len } = stats(), pct = Math.round(len / TOTAL * 100), from = shown ?? pct; shown = pct;
  $('hero').innerHTML = `<div class="ring"><svg viewBox="0 0 36 36"><circle class="tr" cx="18" cy="18" r="15.9155"/><circle class="pr" cx="18" cy="18" r="15.9155" pathLength="100" stroke-dasharray="${from} 100"/></svg><b>${pct}%</b></div><div class="t"><b>${n} van ${STREETS.length} straten</b><span>${km(len)} van ${km(TOTAL)}</span></div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => $('hero').querySelector('.pr')?.setAttribute('stroke-dasharray', pct + ' 100')));
}
let toastT; const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); };
function bingo() {
  const chips = `<div class="chips"><button class="chip" data-w="" aria-pressed="${!who}">Iedereen</button>${people.map(p => `<button class="chip" data-w="${p.id}" aria-pressed="${who === p.id}"><i class="d" style="background:${p.color}"></i>${esc(p.name)}</button>`).join('')}</div>`;
  const tiles = STREETS.map(s => { const { st, c, cs } = stateOf(s.id), p = c && pid(c.person_id), mine = !who || (cs || []).some(x => x.person_id === who || x.partner_id === who);
    return `<button class="tile ${st === 'plan' ? 'busy' : st} ${who && !mine ? 'dim' : ''}" data-s="${s.id}" style="--c:${p ? p.color : '#999'}">${p && st !== 'none' ? `<span class="av">${avHTML(p)}</span>` : ''}${esc(s.name)}</button>`; }).join('');
  return `${chips}<div class="legend"><span><i style="background:#272727"></i>gedaan</span><span><i style="border:2px dashed #272727"></i>bezig of gepland</span><span><i style="background:#fff;box-shadow:inset 0 0 0 1px #ccc"></i>nog te doen</span></div><div class="bingo">${tiles}</div>`;
}
function podium() {
  const { rows } = stats(), key = r => metric === 'km' ? r.len : r.n;
  const sorted = rows.filter(r => r.n || r.b).sort((a, b) => key(b) - key(a) || a.p.name.localeCompare(b.p.name)), max = Math.max(1, ...sorted.map(key));
  const val = r => metric === 'km' ? (r.len / 1000).toFixed(1).replace('.', ',') : r.n, unit = metric === 'km' ? 'km' : 'straten';
  const top = sorted.slice(0, 3), order = [top[1], top[0], top[2]], cls = ['second', 'first', 'third'], nr = [2, 1, 3];
  const pod = top.length >= 3 ? `<div class="pod">${order.map((r, i) => `<div class="p ${cls[i]}" style="--c:${r.p.color}"><div class="av">${avHTML(r.p)}</div><div class="nm">${esc(r.p.name)}</div><div class="sc">${val(r)} ${unit}</div><div class="step">${nr[i]}</div></div>`).join('')}</div>` : '';
  return `<div class="chips"><button class="chip" data-m="km" aria-pressed="${metric === 'km'}">Kilometers</button><button class="chip" data-m="n" aria-pressed="${metric === 'n'}">Aantal straten</button></div>${pod}${sorted.map((r, i) => `<div class="rank" style="--c:${r.p.color}"><span class="n">${i + 1}</span><div class="av">${avHTML(r.p)}</div><div class="m"><b>${esc(r.p.name)}</b><div class="bar"><i style="width:${key(r) / max * 100}%"></i></div></div><div class="v">${val(r)}<small>${unit}${r.b ? ' · ' + r.b + ' bezig' : ''}</small></div></div>`).join('') || '<div class="empty">Nog niemand aan de slag.</div>'}`;
}
function nieuws() {
  const bak = new Date(new Date().getFullYear(), 11, 28); if (bak < new Date()) bak.setFullYear(bak.getFullYear() + 1);
  const days = Math.ceil((bak - new Date()) / 864e5), { n } = stats();
  const ev = claims.filter(c => byId.has(c.street_id)).map(c => ({ c, t: new Date(c.done_at) })).sort((a, b) => b.t - a.t).slice(0, 60);
  const rel = t => { const d = (Date.now() - t) / 6e4; return d < 1 ? 'zonet' : d < 60 ? Math.round(d) + ' min' : d < 1440 ? Math.round(d / 60) + ' u' : t.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' }); };
  const dayName = t => { const y = new Date(); y.setHours(0, 0, 0, 0); const d = new Date(t); d.setHours(0, 0, 0, 0); const diff = Math.round((y - d) / 864e5); return diff === 0 ? 'Vandaag' : diff === 1 ? 'Gisteren' : t.toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' }); };
  let h = `<div class="count"><b>${days}</b><span>dagen tot de bak op 28 december<br>nog ${STREETS.length - n} straten te doen</span></div>`, last = '';
  for (const { c, t } of ev) { const s = byId.get(c.street_id), a = pid(c.person_id), b = c.partner_id && pid(c.partner_id); if (!a) continue; const dn = dayName(t); if (dn !== last) { h += `<div class="day">${esc(dn)}</div>`; last = dn; }
    const nm = esc(a.name) + (b ? ' & ' + esc(b.name) : ''), side = c.side === 'all' ? '' : ` (${c.side === 'odd' ? 'oneven' : 'even'} kant)`, pl = !!b;
    const tx = c.status === 'done' ? `<b>${nm}</b> ${pl ? 'hebben' : 'heeft'} <b>${esc(s.name)}</b>${side} gedaan` : c.status === 'busy' ? `<b>${nm}</b> ${pl ? 'zijn' : 'is'} bezig in <b>${esc(s.name)}</b>${side}` : `<b>${esc(s.name)}</b>${side} is gepland voor <b>${nm}</b>`;
    h += `<div class="ev" style="--c:${a.color}"><div class="av">${avHTML(a)}</div><div class="tx">${tx}</div><time>${rel(t)}</time></div>`; }
  return h + (ev.length ? '' : '<div class="empty">Nog geen activiteit.</div>');
}
function buurt() {
  const groups = new Map(); for (const s of STREETS) { const l = s.name[0].toUpperCase(); (groups.get(l) || groups.set(l, []).get(l)).push(s); }
  return [...groups].sort(([a], [b]) => a.localeCompare(b, 'nl')).map(([l, list]) => {
    const cnt = { done: 0, busy: 0, none: 0 }; list.forEach(s => { const { st } = stateOf(s.id); cnt[st === 'done' ? 'done' : st === 'none' ? 'none' : 'busy']++; });
    const w = k => cnt[k] / list.length * 100;
    return `<div class="card"><h3>${l}<small>${cnt.done} van ${list.length} gedaan</small></h3><div class="stack"><i style="width:${w('done')}%;background:#272727"></i><i style="width:${w('busy')}%;background:#9a9387"></i></div></div>`; }).join('');
}
function render(anim) {
  hero(); const m = $('main'); m.innerHTML = `<div class="${anim ? 'view' : ''}">${tab === 'bingo' ? bingo() : tab === 'podium' ? podium() : tab === 'nieuws' ? nieuws() : buurt()}</div>`;
  $('seg').style.setProperty('--i', ['bingo', 'podium', 'nieuws', 'buurt'].indexOf(tab));
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === tab));
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-t],[data-w],[data-m],[data-s]'); if (!t) return; const D = t.dataset;
