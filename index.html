<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EB">
<title>Pannenkoekenverkoop · Kunst Veredelt Ingelmunster</title>
<link rel="icon" href="assets/symbool.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verkoop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bone:#F4F1EB;--donker:#272727;--zacht:#8a8478;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --tabh:58px;--lift:0px;--spb:cubic-bezier(.34,1.56,.64,1)}
@media(pointer:coarse){:root{--lift:var(--browser,0px)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bone);font:500 12px/1 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.frames{position:fixed;left:0;right:0;top:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + var(--lift))}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bone);opacity:0;visibility:hidden;transition:opacity .28s ease}
.frames iframe.on{opacity:1;visibility:visible}
.tabs{position:fixed;left:0;right:0;bottom:var(--lift);z-index:10;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding:0 max(8px,calc(50% - 280px)) env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(251,249,245,.86);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);box-shadow:0 -1px 0 rgba(39,39,39,.08)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--zacht);border:0;background:none;padding:0;font:inherit;font-weight:600;cursor:pointer;transition:color .2s}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--spb)}
.tab:active svg{transform:scale(.82)}
.tab[aria-selected=true]{color:var(--donker)}
.tab[aria-selected=true] svg{stroke-width:2.3;transform:scale(1.06)}
.tab[aria-selected=true] .fill{fill:currentColor}
.tab::after{content:"";position:absolute;top:0;left:50%;width:22px;height:3px;border-radius:0 0 4px 4px;background:var(--donker);transform:translateX(-50%) scaleX(0);transition:transform .45s var(--spb)}
.tab[aria-selected=true]::after{transform:translateX(-50%) scaleX(1)}
.badge{position:absolute;top:7px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:99px;background:#272727;color:#fff;font-size:10px;line-height:16px;padding:0 4px;text-align:center;display:none}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="frames" id="frames">
  <iframe id="map" title="Kaart" allow="geolocation"></iframe>
  <iframe id="feed" title="Feed"></iframe>
</div>
<nav class="tabs" id="tabs" aria-label="Hoofdmenu">
  <button class="tab" data-t="kaart" aria-selected="true"><svg viewBox="0 0 24 24"><path class="fill" d="M9 4L3 6.500v13L9 17.500l6 2.500 6-2.500v-13L15 7 9 4z"/><path d="M9 4v13.500M15 7v13"/></svg>Kaart</button>
  <button class="tab" data-t="feed" aria-selected="false"><svg viewBox="0 0 24 24"><path class="fill" d="M3 11.500L12 4l9 7.500V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8.500z"/></svg>Feed</button>
  <button class="tab" data-t="rang" aria-selected="false"><svg viewBox="0 0 24 24"><path class="fill" d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg>Ranglijst</button>
  <button class="tab" data-t="ik" aria-selected="false"><svg viewBox="0 0 24 24"><circle class="fill" cx="12" cy="8" r="4"/><path class="fill" d="M4 21a8 8 0 0 1 16 0H4z"/></svg>Ik</button>
</nav>
<script>
(() => {
const $ = id => document.getElementById(id);
const map = $('map'), feed = $('feed'), q = location.search, hash = location.hash;
// De zwevende browserbalk van iOS Safari schuift over de onderkant: laat de tabbalk erboven staan (niet nodig als app op het beginscherm)
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if (!standalone && matchMedia('(pointer:coarse)').matches) document.documentElement.style.setProperty('--browser', '62px');
map.src = 'map.html' + q + hash;
feed.src = 'overzicht.html' + (q ? q + '&' : '?') + 'tab=feed';
let tab = 'kaart', ready = { map: false, feed: false };
function show(t) {
  if (t === 'ik') { select('kaart'); map.contentWindow.postMessage({ go: 'ik' }, location.origin); return; }
  select(t);
  if (t === 'feed' || t === 'rang') feed.contentWindow.postMessage({ tab: t }, location.origin);
}
function select(t) {
  tab = t; document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t || (t === 'kaart' && false)));
  map.classList.toggle('on', t === 'kaart'); feed.classList.toggle('on', t === 'feed' || t === 'rang');
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
}
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return; const t = b.dataset.t;
  if (t === tab && t === 'kaart') map.contentWindow.postMessage({ go: 'home' }, location.origin);     // nog eens op Kaart tikken: terug naar het overzicht
  else if (t === tab && (t === 'feed' || t === 'rang')) feed.contentWindow.postMessage({ top: 1 }, location.origin);
  else show(t);
  if (navigator.vibrate) navigator.vibrate(8);
});
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return; const m = e.data;
  if (m.go) { select('kaart'); map.contentWindow.postMessage(m, location.origin); }        // een straat of persoon in de feed aangetikt: toon hem op de kaart
});
select('kaart');
})();
</script>
</body>
</html>
