<script>
(async () => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg = window.PANNENKOEK_CONFIG || {}, demo = location.search.includes('demo') || !(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY), EMBED = window.top !== window.self;
const STREETS = await (await fetch('data/streets.json')).json(), byId = new Map(STREETS.map(s => [s.id, s])), TOTAL = STREETS.reduce((a, s) => a + s.len, 0);
const km = m => (m / 1000).toFixed(1).replace('.', ',') + ' km', initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
let people = [], claims = [], meId = null, sb = null, session = null, isAdmin = false, authOn = false;
const DAY = 864e5, dk = t => { const d = new Date(t); return d.getFullYear() * 1e4 + (d.getMonth() + 1) * 100 + d.getDate(); };
const go = (go, id) => EMBED ? parent.postMessage({ go, id }, location.origin) : (location.href = 'index.html' + (go === 'straat' ? '#straat=' + id : go === 'persoon' ? '#persoon=' + id : ''));
let toastT; const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); };

/* ---------- gegevens ---------- */
if (!demo) {
  sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: true, detectSessionInUrl: false } });
}
const DK = 'pb-demo2', dread = () => { try { return JSON.parse(localStorage.getItem(DK)) || { people: [], done: [] }; } catch { return { people: [], done: [] }; } };
async function load() {
  if (demo) { const d = dread(); people = d.people; claims = d.done.map(c => ({ ...c, side: c.side || 'all', status: c.status || 'done' })); const lm = localStorage.getItem('pb-me'); meId = lm && people.some(x => x.id === lm) ? lm : null; return; }
  const [p, d] = await Promise.all([sb.from('people').select('*').order('name'), sb.from('done_streets').select('*')]);
  if (p.error || d.error) throw (p.error || d.error);
  people = p.data; claims = d.data.map(c => ({ ...c, side: c.side || 'all', status: c.status || 'done' }));
  authOn = people.length ? 'user_id' in people[0] : false;
  try { const { data } = await sb.auth.getSession(); session = data.session; } catch { session = null; }
  if (authOn && session) { meId = people.find(x => x.user_id === session.user.id)?.id || null; try { const r = await sb.rpc('is_admin'); isAdmin = r.data === true; } catch { isAdmin = false; } }
  else { const lm = localStorage.getItem('pb-me'); meId = lm && people.some(x => x.id === lm) ? lm : null; isAdmin = false; }
}
await load().catch(() => { $('main').innerHTML = '<div class="empty">Kan de gegevens niet laden.</div>'; });
const pid = id => people.find(p => p.id === id), me = () => pid(meId);
const avHTML = p => p.photo_url ? `<img src="${esc(p.photo_url)}" alt="">` : PB_ILL(p);

/* ---------- cijfers ---------- */
function statsOf(id) {
  const my = claims.filter(c => c.person_id === id || c.partner_id === id), done = new Map(), busy = new Set(), plan = new Set(), evs = [];
  for (const c of my) { const s = byId.get(c.street_id); if (!s) continue; if (c.status === 'done') { done.set(c.street_id, s); evs.push(+new Date(c.done_at)); } else if (c.status === 'busy') busy.add(c.street_id); else plan.add(c.street_id); }
  for (const k of done.keys()) { busy.delete(k); plan.delete(k); } for (const k of busy) plan.delete(k);
  let houses = 0, est = false; for (const [sid, st] of done) { let hs = 0; for (const c of my) if (c.street_id === sid && c.status === 'done') hs += (c.side === 'odd' ? (st.ho || 0) : c.side === 'even' ? (st.he || 0) : (st.houses || 0)); houses += Math.min(st.houses || 0, hs); if (!st.hx) est = true; }
  const len = [...done.values()].reduce((a, s) => a + s.len, 0), now = Date.now(), week = evs.filter(t => now - t < 7 * DAY).length;
  const days = new Set(evs.map(dk)); let streak = 0, d = new Date(); d.setHours(12, 0, 0, 0); if (!days.has(dk(d))) d = new Date(d.getTime() - DAY); while (days.has(dk(d))) { streak++; d = new Date(d.getTime() - DAY); }
  return { n: done.size, len, houses, est, week, streak, done: [...done.values()], busy: [...busy].map(i => byId.get(i)).filter(Boolean), plan: [...plan].map(i => byId.get(i)).filter(Boolean) };
}
function rankBy(id, key) {
  const v = q => key === 'len' ? statsOf(q).len : key === 'n' ? statsOf(q).n : statsOf(q).houses;
  if (!v(id)) return '';
  const all = people.map(q => ({ id: q.id, v: v(q.id), name: q.name })).filter(q => q.v > 0).sort((a, b) => b.v - a.v || a.name.localeCompare(b.name, 'nl'));
  const i = all.findIndex(q => q.id === id); return i < 0 ? '' : '#' + (i + 1);
}
const rkT = (r, w, c) => { if (!r) return ''; const n = +r.slice(1), cls = n <= 3 ? 'r' + n : 'rn', lab = 'Plaats ' + n + ' in het klassement op ' + w; return `<i class="rb ${cls}" style="--pc:${c || '#888'}" title="${lab}" aria-label="${lab}">${n === 1 ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-1.800 10.500H4.800L3 8zm1.800 12h14.400v1.800H4.800V20z"/></svg>' : ''}${r}</i>`; };
function rankOf(id) { const all = people.map(p => ({ id: p.id, len: statsOf(p.id).len })).filter(r => r.len > 0).sort((a, b) => b.len - a.len); const i = all.findIndex(r => r.id === id); return i < 0 ? null : i + 1; }

/* ---------- scherm ---------- */
const ic = {

  map: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4L3 6.500v13L9 17.500l6 2.500 6-2.500v-13L15 7 9 4z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  img: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>',
  help: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.500 9.500a2.500 2.500 0 1 1 3.500 2.300c-.700.400-1 .900-1 1.700M12 17h.01"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
  table: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 4v16"/></svg>',
  out: '<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  swap: '<svg viewBox="0 0 24 24"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg>',
};
const chev = '<span class="c">›</span>';
const icx = {
  tag: '<svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.500" cy="8.500" r="1.200"/></svg>',
  vib: '<svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4 8v8M20 8v8"/></svg>',
  pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-6.500-5.600-6.500-11a6.500 6.500 0 0 1 13 0c0 5.400-6.500 11-6.500 11z"/><circle cx="12" cy="10" r="2.400"/></svg>',
  phone: '<svg viewBox="0 0 24 24"><path d="M22 16.900v3a2 2 0 0 1-2.200 2 19.800 19.800 0 0 1-8.600-3.100 19.500 19.500 0 0 1-6-6A19.800 19.800 0 0 1 2.100 4.200 2 2 0 0 1 4.100 2h3a2 2 0 0 1 2 1.700c.1 1 .4 1.900.7 2.800a2 2 0 0 1-.5 2.100L8.100 9.900a16 16 0 0 0 6 6l1.300-1.300a2 2 0 0 1 2.100-.4c.9.300 1.800.6 2.800.7a2 2 0 0 1 1.700 2z"/></svg>'
};
/* trilling: op een iPhone bestaat er geen echte trilfunctie voor websites. De enige weg is een verborgen schakelaar (iOS 17.4 of nieuwer) die je tikt: dat geeft de systeemtrilling. Dat moet in de pagina waar je tikte en meteen bij de tik, niet na een wachttijd. */

}
const hapticOn = () => { try { return localStorage.getItem('pb-haptic') !== 'off'; } catch { return true; } };

const ROLES = ['Deegmaker', 'Gieter', 'Draaier', 'Netverlegger', 'Pannenkoekenraper', 'Verpakker', 'Rondvoerder'];
const hasRole = () => demo || (people.length && 'role' in people[0]);          // pas zichtbaar als supabase-rollen.sql is uitgevoerd
function render() {
  const m = me(), root = $('main');

    const done = v => { i.remove(); res(v); }; i.onchange = () => done(i.files[0] || null); i.oncancel = () => done(null); i.click(); });

/* foto lezen die ook werkt als createImageBitmap iets niet aankan (oudere Safari, vreemde formaten) en grote foto's eerst verkleint (iPhone-foto's van 12 tot 48 MP laten anders het canvas falen) */
async function loadPhoto(file, maxDim = 2400) {
  let src = null;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch {}
  if (!src) { try { src = await createImageBitmap(file); } catch {} }
  if (!src) src = await new Promise((res, rej) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Deze foto kan niet gelezen worden. Probeer een andere foto.')); }; i.src = u; });
  const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height, k = Math.min(1, maxDim / Math.max(w, h));
  if (k < 1 || src instanceof HTMLImageElement) { const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); src.close?.(); return c; }
  return src;
}
async function square(file) {
  // Laat de gebruiker de foto verschuiven en inzoomen in een ronde uitsnede; wat binnen de cirkel valt, wordt de profielfoto.
  const bmp = await loadPhoto(file);
  const dlgC = $('crop'), V = 300, OUT = 512, M = 5;
  return new Promise(resolve => {
    dlgC.innerHTML = `<h2>Foto bijsnijden</h2><div class="cropbox" id="cb"><canvas id="cv"></canvas></div>
      <div class="hint">Sleep om te verplaatsen, knijp of schuif om te zoomen</div>
      <div class="zoomrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6"/></svg><input type="range" id="zm" min="0" max="1" step="0.001" value="0" aria-label="Zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6"/></svg></div>
      <div class="actions"><button class="btn g" data-c="no">Annuleer</button><button class="btn" data-c="ok">Gebruik foto</button></div>`;
    const cb = $('cb'), cv = $('cv'), zm = $('zm'), dpr = Math.min(devicePixelRatio || 1, 2);
    dlgC.showModal();
    const size = cb.clientWidth || V, inner = size - 2 * M, min = inner / Math.min(bmp.width, bmp.height), max = min * 5;
    cv.width = cv.height = Math.round(size * dpr);
    let sc = min, ox = (size - bmp.width * sc) / 2, oy = (size - bmp.height * sc) / 2;
    const clamp = () => { ox = Math.min(M, Math.max(size - M - bmp.width * sc, ox)); oy = Math.min(M, Math.max(size - M - bmp.height * sc, oy)); };
    const draw = () => {
      const k = cv.width / size, g = cv.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, size, size); g.imageSmoothingQuality = 'high';
      g.drawImage(bmp, ox, oy, bmp.width * sc, bmp.height * sc);
      g.fillStyle = 'rgba(39,39,39,.55)'; g.beginPath(); g.rect(0, 0, size, size); g.arc(size / 2, size / 2, inner / 2, 0, Math.PI * 2, true); g.fill('evenodd');
      g.strokeStyle = 'rgba(250,248,244,.9)'; g.lineWidth = 2; g.beginPath(); g.arc(size / 2, size / 2, inner / 2, 0, Math.PI * 2); g.stroke();
    };
    const setScale = (ns, cx = size / 2, cy = size / 2) => { ns = Math.min(max, Math.max(min, ns)); const r = ns / sc; ox = cx - (cx - ox) * r; oy = cy - (cy - oy) * r; sc = ns; clamp(); zm.value = Math.log(sc / min) / Math.log(max / min); draw(); };
    clamp(); draw();
    // slepen + knijpen
    const ptrs = new Map(); let last = null;
    cb.onpointerdown = e => { cb.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); last = null; };
    cb.onpointermove = e => {
      if (!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      const r = cb.getBoundingClientRect();
      if (ptrs.size === 1) { ox += e.clientX - prev[0]; oy += e.clientY - prev[1]; clamp(); draw(); }
      else if (ptrs.size === 2) {
        const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        if (last) setScale(sc * d / last, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); last = d;
      }
    };
    cb.onpointerup = cb.onpointercancel = e => { ptrs.delete(e.pointerId); last = null; };
    cb.onwheel = e => { e.preventDefault(); const r = cb.getBoundingClientRect(); setScale(sc * Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top); };
    zm.oninput = () => setScale(min * Math.pow(max / min, +zm.value));
    let result = null;
    dlgC.onclick = async e => {
      const c = e.target.closest('[data-c]')?.dataset.c;
      if (c === 'no') dlgC.close();
      if (c === 'ok') {
        const o = document.createElement('canvas'); o.width = o.height = OUT; const g = o.getContext('2d'), k = OUT / inner; g.imageSmoothingQuality = 'high';
        g.drawImage(bmp, (ox - M) * k, (oy - M) * k, bmp.width * sc * k, bmp.height * sc * k);        // enkel wat in de cirkel valt
        result = await new Promise(r => o.toBlob(r, 'image/jpeg', .9)); dlgC.close();
      }
    };
    dlgC.onclose = () => { dlgC.onclose = null; bmp.close?.(); resolve(result); };
  });
}

    const b = e.target.closest('[data-f],[data-d]'); if (!b) { if (e.target === dlg) dlg.close(); return; } if (b.dataset.d === 'no') return dlg.close();
    const v = b.dataset.f || null;
    try { if (demo) { const d = dread(); const x = d.people.find(q => q.id === m.id); if (x) x.photo_url = v; localStorage.setItem(DK, JSON.stringify(d)); await load(); } else { const r = await sb.from('people').update({ photo_url: v }).eq('id', m.id); if (r.error) throw r.error; await load(); } dlg.close(); render(); trk('figuur_gekozen'); toast(v ? 'Figuur gekozen' : 'Figuur is weer automatisch'); } catch (err) { console.error(err); toast('Opslaan mislukt'); }
  };
}
function nameDialog() {
  const m = me(); dlg.innerHTML = `<h2>Naam wijzigen</h2><input id="nm" value="${esc(m.name)}" maxlength="30" autocomplete="off"><div class="acts"><button class="btn" data-d="ok">Opslaan</button><button class="btn g" data-d="no">Annuleer</button></div>`; dlg.showModal();
  dlg.onclick = async e => { const d = e.target.closest('[data-d]')?.dataset.d; if (!d) { if (e.target === dlg) dlg.close(); return; } if (d === 'no') return dlg.close();
    const v = $('nm').value.trim(); if (!v) return $('nm').focus(); if (people.some(p => p.id !== m.id && p.name.toLowerCase() === v.toLowerCase())) return toast('Die naam bestaat al');
    try { if (demo) { const d = dread(); const x = d.people.find(q => q.id === m.id); if (x) x.name = v; localStorage.setItem(DK, JSON.stringify(d)); await load(); } else { const r = await sb.from('people').update({ name: v }).eq('id', m.id); if (r.error) throw r.error; await load(); } dlg.close(); render(); toast('Naam bijgewerkt'); } catch (err) { console.error(err); toast('Opslaan mislukt'); } };
}
document.addEventListener('click', e => { if (e.target.closest('.avw .av')) { try { window.PB_ROLEPOP && PB_ROLEPOP($('main'), 0); } catch {} } });          // op de foto tikken: de functie springt er opnieuw uit
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-rank],[data-a],[data-s],[data-p]'); if (!t) return; const D = t.dataset;
  if (D.rank) { if (EMBED) parent.postMessage({ show: 'rang', metric: D.rank, pid: meId }, location.origin); return; }          // cijfer aantikken: het klassement erover, met jou in beeld
  if (D.s) return go('straat', D.s);
  if (D.p) { meId = D.p; localStorage.setItem('pb-me', D.p); render(); return; }
  if (D.a === 'map') return go('persoon', meId);
  if (D.a === 'add') return go('pick');
  if (D.a === 'guide') return go('guide');
  if (D.a === 'update') { toast('Nieuwste versie wordt opgehaald…'); const ok = await window.__updateApp(); if (!ok) { await load(); render(); toast('Je hebt al de nieuwste versie'); } return; }
  if (D.a === 'photo') return setPhoto();
  if (D.a === 'photomenu') return photoMenu();
  if (D.a === 'haptic') { const on = !hapticOn(); try { if (on) localStorage.removeItem('pb-haptic'); else localStorage.setItem('pb-haptic', 'off'); } catch {} t.setAttribute('aria-checked', on); t.querySelector('.sw')?.classList.toggle('on', on); if (on) hapticNow(); return; }
  if (D.a === 'hapticTest') { hapticNow(); toast(hapticOn() ? 'Voelde je dat? Zo niet: zie Instellingen › Geluiden en haptiek › Systeemhaptiek.' : 'Trillingen staan uit in de app'); return; }
  if (D.a === 'loc') return locTap();
  if (D.a === 'contact') return contactDlg();
  if (D.a === 'delme') return deleteMe();
  if (D.a === 'name') return nameDialog();
  if (D.a === 'figuur') return figuurDialog();
  if (D.a === 'install') { trk('installeer_tik'); if (EMBED) parent.postMessage({ install: 1 }, location.origin); else toast('Open de site in je browser en kies Deel, dan “Zet op beginscherm”'); return; }
  if (D.a === 'role') return roleDialog();
  if (D.a === 'new') return go('nieuw');
  if (D.a === 'login') return go('ik');
  if (D.a === 'switch') { meId = null; try { localStorage.removeItem('pb-me'); } catch {} render(); return; }
  if (D.a === 'logout') { try { await sb.auth.signOut(); } catch {} session = null; meId = null; isAdmin = false; render(); toast('Uitgelogd'); return; }
  if (D.a === 'share') { const url = location.origin + location.pathname.replace(/profiel\.html$/, '') + '#persoon=' + meId; try { if (navigator.share) await navigator.share({ title: me().name + ' · Pannenkoekenverkoop', url }); else { await navigator.clipboard.writeText(url); toast('Link gekopieerd'); } } catch {} }
});
addEventListener('storage', async e => { if (e.key === 'pb-me' || e.key === DK) { await load(); render(); } });
addEventListener('message', async e => { if (e.origin !== location.origin || !e.data) return; if (e.data.space) document.documentElement.style.setProperty('--tabspace', e.data.space + 'px'); if (e.data.refresh) { await load(); render(); scrollTo(0, 0); if (EMBED) parent.postMessage({ ackd: e.data.ack }, location.origin); } if (e.data.top) scrollTo({ top: 0, behavior: 'smooth' }); });
if (EMBED) parent.postMessage({ ready: 'profile' }, location.origin);
window.__refresh = async () => { if (await window.__updateApp()) return; await load(); render(); };
render();
})();
</script>
