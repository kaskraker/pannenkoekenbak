<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EB">
<title>Ik · Pannenkoekenverkoop Ingelmunster</title>
<link rel="icon" href="assets/icon-192.png">
<style>
:root{--bone:#F4F1EB;--pagina:#FAF8F4;--kaart:#EFEAE1;--lijn:#D5CCBF;--donker:#272727;--tekst:#3c3c3b;--zacht:#6f695d;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --glow:inset 0 1px 0 rgba(255,255,255,.85);--edge:inset 0 0 0 1px rgba(39,39,39,.06);--sh:0 1px 2px rgba(39,39,39,.06),0 8px 24px rgba(39,39,39,.1);
  --sp:cubic-bezier(.2,.8,.2,1);--spb:cubic-bezier(.34,1.56,.64,1);--tabspace:96px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bone);color:var(--tekst);font:500 15.5px/1.42 var(--font);-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit}button{border:0;background:none;padding:0;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 14px calc(var(--tabspace) + 24px)}
.view{animation:in .45s var(--sp) both}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.top{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 18px}
.avw{position:relative;width:104px;height:104px;margin-bottom:12px}
.av{width:100%;height:100%;border-radius:50%;background:var(--c);color:#fff;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c),0 10px 24px rgba(39,39,39,.22)}
.av img{width:100%;height:100%;object-fit:cover}
.cam{position:absolute;right:-2px;bottom:0;width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#3d3d3d,#242424);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--bone),0 4px 10px rgba(0,0,0,.25);transition:transform .5s var(--spb)}.cam:active{transform:scale(.88)}.cam svg{width:17px}
h1{margin:0;font-size:28px;letter-spacing:-.03em;color:var(--donker);line-height:1.1}
.sub{color:var(--zacht);margin-top:4px;font-size:14.5px}
.pill{display:inline-block;margin-top:8px;padding:3px 11px;border-radius:99px;background:rgba(39,39,39,.07);box-shadow:var(--edge);font-size:12.5px;font-weight:700;color:var(--donker)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--pagina);border-radius:20px;padding:12px 8px;text-align:center;box-shadow:var(--glow),var(--edge),var(--sh)}
.st b{display:block;font-size:26px;letter-spacing:-.04em;color:var(--donker);line-height:1.05;font-variant-numeric:tabular-nums}.st span{font-size:12.5px;color:var(--zacht)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:99px;font-weight:700;font-size:16px;background:linear-gradient(180deg,#3d3d3d,#242424);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 18px rgba(0,0,0,.22);transition:transform .5s var(--spb);text-decoration:none}
.btn:active{transform:scale(.97)}.btn.g{background:rgba(39,39,39,.06);color:var(--donker);box-shadow:inset 0 0 0 1px rgba(39,39,39,.07)}.btn svg{width:19px}
.btns{display:grid;gap:8px;margin-bottom:6px}
h2{margin:24px 4px 8px;font-size:13.5px;font-weight:700;color:var(--zacht)}
.grp{background:var(--pagina);border-radius:22px;overflow:hidden;box-shadow:var(--glow),var(--edge),var(--sh)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left;text-decoration:none;color:var(--donker);transition:background .15s}
.row+.row{border-top:1px solid var(--kaart)}.row:active{background:rgba(39,39,39,.06)}
@media(hover:hover){.row:hover{background:rgba(39,39,39,.035)}}
.row .t{flex:1;min-width:0}.row .t small{display:block;color:var(--zacht);font-size:13px}.row .c{color:var(--zacht);font-size:20px;opacity:.6}
.row .ic{width:30px;height:30px;border-radius:9px;background:rgba(39,39,39,.07);display:flex;align-items:center;justify-content:center;flex:none;color:var(--donker)}.row .ic svg{width:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}.row .dot.b{background:none;border:2.5px dashed var(--c)}
.row .km{color:var(--zacht);font-size:13.5px}
.danger{color:#b3261e}
.empty{padding:22px 16px;text-align:center;color:var(--zacht)}
.pick .row .av2{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.pick .row .av2 img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:calc(var(--tabspace) + 8px);transform:translate(-50%,24px);opacity:0;pointer-events:none;background:rgba(34,34,34,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;box-shadow:var(--sh);transition:opacity .25s,transform .5s var(--spb);max-width:calc(100% - 24px);text-align:center;z-index:20}.toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:28px;padding:20px;width:min(420px,calc(100% - 20px));background:rgba(252,250,247,.98);box-shadow:var(--glow),var(--edge),0 24px 60px rgba(39,39,39,.3);color:var(--tekst);font:inherit}
dialog::backdrop{background:rgba(30,26,22,.4);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
dialog[open]{animation:in .4s var(--spb)}dialog h2{margin:0 0 12px;font-size:22px;color:var(--donker);letter-spacing:-.02em}
dialog input{width:100%;font:inherit;font-size:16px;padding:13px 16px;border:0;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--lijn);outline:none;color:var(--donker)}dialog input:focus{box-shadow:inset 0 0 0 1.5px var(--donker)}
.acts{display:grid;gap:8px;margin-top:14px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
#crop{width:min(360px,calc(100% - 24px))}
.cropbox{position:relative;width:100%;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--donker);touch-action:none;cursor:grab;user-select:none}
.cropbox canvas{width:100%;height:100%;display:block}
.zoomrow{display:flex;align-items:center;gap:12px;margin:16px 4px 18px;color:var(--zacht)}.zoomrow svg{width:18px;height:18px;flex:none}.zoomrow input{flex:1;padding:0;box-shadow:none;background:none;accent-color:var(--donker)}
.hint{text-align:center;font-size:13px;color:var(--zacht);margin:10px 0 0}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 14px}.rolechip{padding:12px 10px;border-radius:16px;background:rgba(39,39,39,.06);box-shadow:inset 0 0 0 1px rgba(39,39,39,.07);font:inherit;font-weight:600;font-size:15px;color:var(--donker);text-align:center}.rolechip.on{background:var(--donker);color:#fff}


.avw:has(.rolebox){margin-top:40px}
</style>
</head>
<body>
<div class="wrap" id="main"></div>
<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>
<dialog id="crop"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="avatars.js?v=20261124a"></script>
<script>
(async () => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg = window.PANNENKOEK_CONFIG || {}, demo = location.search.includes('demo') || !(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY), EMBED = window.top !== window.self;
const STREETS = await (await fetch('data/streets.json')).json(), byId = new Map(STREETS.map(s => [s.id, s])), TOTAL = STREETS.reduce((a, s) => a + s.len, 0);
const km = m => (m / 1000).toFixed(1).replace('.', ',') + ' km', initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
let people = [], claims = [], meId = null, sb = null, session = null, isAdmin = false, authOn = false;
const DAY = 864e5, dk = t => { const d = new Date(t); return d.getFullYear() * 1e4 + (d.getMonth() + 1) * 100 + d.getDate(); };
const go = (go, id) => EMBED ? parent.postMessage({ go, id }, location.origin) : (location.href = 'index.html' + (go === 'straat' ? '#straat=' + id : go === 'persoon' ? '#persoon=' + id : ''));
let toastT; const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); };

/* ---------- gegevens ---------- */
if (!demo) {
  sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: true, detectSessionInUrl: false } });
}
const DK = 'pb-demo2', dread = () => { try { return JSON.parse(localStorage.getItem(DK)) || { people: [], done: [] }; } catch { return { people: [], done: [] }; } };
async function load() {
  if (demo) { const d = dread(); people = d.people; claims = d.done.map(c => ({ ...c, side: c.side || 'all', status: c.status || 'done' })); const lm = localStorage.getItem('pb-me'); meId = lm && people.some(x => x.id === lm) ? lm : null; return; }
  const [p, d] = await Promise.all([sb.from('people').select('*').order('name'), sb.from('done_streets').select('*')]);
  if (p.error || d.error) throw (p.error || d.error);
  people = p.data; claims = d.data.map(c => ({ ...c, side: c.side || 'all', status: c.status || 'done' }));
  authOn = people.length ? 'user_id' in people[0] : false;
  try { const { data } = await sb.auth.getSession(); session = data.session; } catch { session = null; }
  if (authOn && session) { meId = people.find(x => x.user_id === session.user.id)?.id || null; try { const r = await sb.rpc('is_admin'); isAdmin = r.data === true; } catch { isAdmin = false; } }
  else { const lm = localStorage.getItem('pb-me'); meId = lm && people.some(x => x.id === lm) ? lm : null; isAdmin = false; }
}
await load().catch(() => { $('main').innerHTML = '<div class="empty">Kan de gegevens niet laden.</div>'; });
const pid = id => people.find(p => p.id === id), me = () => pid(meId);
const avHTML = p => p.photo_url ? `<img src="${esc(p.photo_url)}" alt="">` : PB_ILL(p);

/* ---------- cijfers ---------- */
function statsOf(id) {
  const my = claims.filter(c => c.person_id === id || c.partner_id === id), done = new Map(), busy = new Set(), evs = [];
  for (const c of my) { const s = byId.get(c.street_id); if (!s) continue; if (c.status === 'done') { done.set(c.street_id, s); evs.push(+new Date(c.done_at)); } else busy.add(c.street_id); }
  for (const k of done.keys()) busy.delete(k);
  let houses = 0, est = false; for (const [sid, st] of done) { let hs = 0; for (const c of my) if (c.street_id === sid && c.status === 'done') hs += (c.side === 'odd' ? (st.ho || 0) : c.side === 'even' ? (st.he || 0) : (st.houses || 0)); houses += Math.min(st.houses || 0, hs); if (!st.hx) est = true; }
  const len = [...done.values()].reduce((a, s) => a + s.len, 0), now = Date.now(), week = evs.filter(t => now - t < 7 * DAY).length;
  const days = new Set(evs.map(dk)); let streak = 0, d = new Date(); d.setHours(12, 0, 0, 0); if (!days.has(dk(d))) d = new Date(d.getTime() - DAY); while (days.has(dk(d))) { streak++; d = new Date(d.getTime() - DAY); }
  return { n: done.size, len, houses, est, week, streak, done: [...done.values()], busy: [...busy].map(i => byId.get(i)).filter(Boolean) };
}
function rankOf(id) { const all = people.map(p => ({ id: p.id, len: statsOf(p.id).len })).filter(r => r.len > 0).sort((a, b) => b.len - a.len); const i = all.findIndex(r => r.id === id); return i < 0 ? null : i + 1; }

/* ---------- scherm ---------- */
const ic = {
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  map: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4L3 6.500v13L9 17.500l6 2.500 6-2.500v-13L15 7 9 4z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  img: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>',
  help: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.500 9.500a2.500 2.500 0 1 1 3.500 2.300c-.700.400-1 .900-1 1.700M12 17h.01"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
  table: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 4v16"/></svg>',
  out: '<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  swap: '<svg viewBox="0 0 24 24"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg>',
};
const chev = '<span class="c">›</span>';
const GROUP_NAMES = ['muziekfabriek'], isGroup = p => !!p && GROUP_NAMES.includes(String(p.name).trim().toLowerCase());   // groepen: wel te kiezen bij een straat of in een tag, niet als 'wie ben jij'
const ROLES = ['Deegmaker', 'Gieter', 'Draaier', 'Netverlegger', 'Pannenkoekenraper', 'Verpakker', 'Rondvoerder'];
const hasRole = () => demo || (people.length && 'role' in people[0]);          // pas zichtbaar als supabase-rollen.sql is uitgevoerd
function render() {
  const m = me(), root = $('main');
  if (!m) {
    root.innerHTML = `<div class="view"><div class="top"><div class="avw"><div class="av" style="--c:#999">?</div></div><h1>Wie ben jij?</h1><div class="sub">${authOn ? 'Log in om jouw profiel te zien.' : 'Kies jezelf om jouw profiel te zien.'}</div></div>
      ${authOn ? `<div class="btns"><button class="btn" data-a="login">Inloggen of account maken</button></div>` : `<div class="grp pick">${people.filter(p => !isGroup(p)).map(p => `<button class="row" data-p="${p.id}" style="--c:${p.color}"><span class="av2">${avHTML(p)}</span><span class="t">${esc(p.name)}</span>${chev}</button>`).join('') || '<div class="empty">Nog niemand erbij.</div>'}</div><div class="btns" style="margin-top:12px"><button class="btn g" data-a="new">Ik sta er nog niet bij</button></div>`}</div>`;
    return;
  }
  const st = statsOf(m.id), rk = rankOf(m.id), pct = Math.round(st.len / TOTAL * 100);
  const row = (s, busy) => `<button class="row" data-s="${s.id}" style="--c:${m.color}"><span class="dot ${busy ? 'b' : ''}"></span><span class="t">${esc(s.name)}</span><span class="km">${km(s.len)}</span>${chev}</button>`;
  root.innerHTML = `<div class="view"><div class="top"><div class="avw" style="--c:${m.color}"><div class="av" style="--c:${m.color}">${avHTML(m)}</div><button class="cam" data-a="photo" aria-label="Foto wijzigen">${ic.cam}</button>${PB_ROLEBOX(m.role, m.color)}</div>
    <h1>${esc(m.name)}</h1><div class="sub">${m.role ? esc(m.role) + ' · ' : ''}${st.n ? `${st.n} ${st.n === 1 ? 'straat' : 'straten'} gedaan` : 'Nog geen straten gedaan'}</div>${isAdmin ? '<span class="pill">Beheerder</span>' : ''}</div>
    <div class="stats"><div class="st"><b>${st.n}</b><span>straten</span></div><div class="st"><b>${(st.len / 1000).toFixed(1).replace('.', ',')}</b><span>kilometer</span></div><div class="st"><b>${st.houses ? (st.est ? '≈ ' : '') + Math.round(st.houses).toLocaleString('nl-BE') : '0'}</b><span>huizen</span></div>
      <div class="st"><b>${st.week}</b><span>deze week</span></div><div class="st"><b>${st.streak}</b><span>dagen op rij</span></div><div class="st"><b>${rk ? '#' + rk : '–'}</b><span>ranglijst</span></div></div>
    <div class="btns"><button class="btn" data-a="map">${ic.map}Mijn straten op de kaart</button><button class="btn g" data-a="add">${ic.plus}Straten toevoegen</button></div>
    ${st.busy.length ? `<h2>Bezig (${st.busy.length})</h2><div class="grp">${st.busy.map(s => row(s, true)).join('')}</div>` : ''}
    <h2>Gedaan (${st.n})</h2><div class="grp">${st.done.sort((a, b) => a.name.localeCompare(b.name, 'nl')).map(s => row(s, false)).join('') || '<div class="empty">Nog geen straten gedaan. Tik op “Straten toevoegen” om te beginnen.</div>'}</div>
    <h2>Instellingen</h2><div class="grp">
      <button class="row" data-a="photo"><span class="ic">${ic.img}</span><span class="t">Profielfoto wijzigen</span>${chev}</button>
      <button class="row" data-a="name"><span class="ic">${ic.user}</span><span class="t">Naam wijzigen<small>${esc(m.name)}</small></span>${chev}</button>
      ${hasRole() ? `<button class="row" data-a="role"><span class="ic">${ic.user}</span><span class="t">Mijn functie<small>${m.role ? esc(m.role) : 'Gieter, Verpakker, …'}</small></span>${chev}</button>` : ''}
      ${(matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) ? '' : `<button class="row" data-a="install"><span class="ic">${ic.plus}</span><span class="t">Zet de app op je beginscherm<small>Opent sneller, zoals een gewone app</small></span>${chev}</button>`}
      <button class="row" data-a="share"><span class="ic">${ic.share}</span><span class="t">Deel mijn profiel</span>${chev}</button>
      <button class="row" data-a="update"><span class="ic">${ic.swap}</span><span class="t">App vernieuwen<small>Haalt de nieuwste versie op</small></span>${chev}</button>
      <button class="row" data-a="guide"><span class="ic">${ic.help}</span><span class="t">Hoe werkt het?</span>${chev}</button>
      ${isAdmin ? `<a class="row" href="beheer.html" target="_top"><span class="ic">${ic.table}</span><span class="t">Beheerscherm</span>${chev}</a>` : ''}
      ${authOn ? `<button class="row danger" data-a="logout"><span class="ic">${ic.out}</span><span class="t">Uitloggen</span></button>` : `<button class="row" data-a="switch"><span class="ic">${ic.swap}</span><span class="t">Niet jij? Wissel van persoon</span>${chev}</button>`}
    </div></div>`;
  try { window.PB_ROLEPOP && PB_ROLEPOP(root, 500); } catch {}                                     // functie springt er even uit en verdwijnt weer
}

/* ---------- acties ---------- */
const dlg = $('dlg');
function chooseFile() {
  return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.style.cssText = 'position:fixed;left:-9999px;opacity:0'; document.body.appendChild(i);   // in de pagina houden: iOS Safari gooit losse invoervelden soms weg voor de keuze binnen is
    const done = v => { i.remove(); res(v); }; i.onchange = () => done(i.files[0] || null); i.oncancel = () => done(null); i.click(); });
}
/* foto lezen die ook werkt als createImageBitmap iets niet aankan (oudere Safari, vreemde formaten) en grote foto's eerst verkleint (iPhone-foto's van 12 tot 48 MP laten anders het canvas falen) */
async function loadPhoto(file, maxDim = 2400) {
  let src = null;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch {}
  if (!src) { try { src = await createImageBitmap(file); } catch {} }
  if (!src) src = await new Promise((res, rej) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Deze foto kan niet gelezen worden. Probeer een andere foto.')); }; i.src = u; });
  const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height, k = Math.min(1, maxDim / Math.max(w, h));
  if (k < 1 || src instanceof HTMLImageElement) { const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); src.close?.(); return c; }
  return src;
}
async function square(file) {
  // Laat de gebruiker de foto verschuiven en inzoomen in een ronde uitsnede; wat binnen de cirkel valt, wordt de profielfoto.
  const bmp = await loadPhoto(file);
  const dlgC = $('crop'), V = 300, OUT = 512, M = 5;
  return new Promise(resolve => {
    dlgC.innerHTML = `<h2>Foto bijsnijden</h2><div class="cropbox" id="cb"><canvas id="cv"></canvas></div>
      <div class="hint">Sleep om te verplaatsen, knijp of schuif om te zoomen</div>
      <div class="zoomrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6"/></svg><input type="range" id="zm" min="0" max="1" step="0.001" value="0" aria-label="Zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6"/></svg></div>
      <div class="actions"><button class="btn g" data-c="no">Annuleer</button><button class="btn" data-c="ok">Gebruik foto</button></div>`;
    const cb = $('cb'), cv = $('cv'), zm = $('zm'), dpr = Math.min(devicePixelRatio || 1, 2);
    dlgC.showModal();
    const size = cb.clientWidth || V, inner = size - 2 * M, min = inner / Math.min(bmp.width, bmp.height), max = min * 5;
    cv.width = cv.height = Math.round(size * dpr);
    let sc = min, ox = (size - bmp.width * sc) / 2, oy = (size - bmp.height * sc) / 2;
    const clamp = () => { ox = Math.min(M, Math.max(size - M - bmp.width * sc, ox)); oy = Math.min(M, Math.max(size - M - bmp.height * sc, oy)); };
    const draw = () => {
      const k = cv.width / size, g = cv.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, size, size); g.imageSmoothingQuality = 'high';
      g.drawImage(bmp, ox, oy, bmp.width * sc, bmp.height * sc);
      g.fillStyle = 'rgba(39,39,39,.55)'; g.beginPath(); g.rect(0, 0, size, size); g.arc(size / 2, size / 2, inner / 2, 0, Math.PI * 2, true); g.fill('evenodd');
      g.strokeStyle = 'rgba(250,248,244,.9)'; g.lineWidth = 2; g.beginPath(); g.arc(size / 2, size / 2, inner / 2, 0, Math.PI * 2); g.stroke();
    };
    const setScale = (ns, cx = size / 2, cy = size / 2) => { ns = Math.min(max, Math.max(min, ns)); const r = ns / sc; ox = cx - (cx - ox) * r; oy = cy - (cy - oy) * r; sc = ns; clamp(); zm.value = Math.log(sc / min) / Math.log(max / min); draw(); };
    clamp(); draw();
    // slepen + knijpen
    const ptrs = new Map(); let last = null;
    cb.onpointerdown = e => { cb.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); last = null; };
    cb.onpointermove = e => {
      if (!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      const r = cb.getBoundingClientRect();
      if (ptrs.size === 1) { ox += e.clientX - prev[0]; oy += e.clientY - prev[1]; clamp(); draw(); }
      else if (ptrs.size === 2) {
        const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        if (last) setScale(sc * d / last, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); last = d;
      }
    };
    cb.onpointerup = cb.onpointercancel = e => { ptrs.delete(e.pointerId); last = null; };
    cb.onwheel = e => { e.preventDefault(); const r = cb.getBoundingClientRect(); setScale(sc * Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top); };
    zm.oninput = () => setScale(min * Math.pow(max / min, +zm.value));
    let result = null;
    dlgC.onclick = async e => {
      const c = e.target.closest('[data-c]')?.dataset.c;
      if (c === 'no') dlgC.close();
      if (c === 'ok') {
        const o = document.createElement('canvas'); o.width = o.height = OUT; const g = o.getContext('2d'), k = OUT / inner; g.imageSmoothingQuality = 'high';
        g.drawImage(bmp, (ox - M) * k, (oy - M) * k, bmp.width * sc * k, bmp.height * sc * k);        // enkel wat in de cirkel valt
        result = await new Promise(r => o.toBlob(r, 'image/jpeg', .9)); dlgC.close();
      }
    };
    dlgC.onclose = () => { dlgC.onclose = null; bmp.close?.(); resolve(result); };
  });
}
async function setPhoto() {
  const f = await chooseFile(); if (!f) return; let blob; try { blob = await square(f); } catch (err) { console.error(err); return toast(err.message || 'Foto lezen mislukt'); } const m = me(); if (!blob) return;
  try {
    if (demo) { const url = await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(blob); }); const d = dread(); const x = d.people.find(q => q.id === m.id); if (x) x.photo_url = url; localStorage.setItem(DK, JSON.stringify(d)); await load(); }
    else { const path = m.id + '.jpg', up = await sb.storage.from('avatars').upload(path, blob, { upsert: true, contentType: 'image/jpeg', cacheControl: '60' }); if (up.error) throw up.error; const url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl + '?v=' + Date.now(); const r = await sb.from('people').update({ photo_url: url }).eq('id', m.id); if (r.error) throw r.error; await load(); }
    render(); toast('Foto bijgewerkt');
  } catch (e) { console.error(e); toast('Foto opslaan mislukt'); }
}
function roleDialog() {
  const m = me(); dlg.innerHTML = `<h2>Ik ben een…</h2><div class="rolegrid">${ROLES.map(r => `<button class="rolechip ${m.role === r ? 'on' : ''}" data-r="${r}">${r}</button>`).join('')}</div><div class="acts"><button class="btn g" data-d="no">Annuleer</button>${m.role ? '<button class="btn g" data-r="">Geen functie</button>' : ''}</div>`; dlg.showModal(); document.activeElement?.blur();          // niets vooraf gemarkeerd
  dlg.onclick = async e => {
    const b = e.target.closest('[data-r],[data-d]'); if (!b) { if (e.target === dlg) dlg.close(); return; } if (b.dataset.d === 'no') return dlg.close();
    const v = b.dataset.r || null;
    try { if (demo) { const d = dread(); const x = d.people.find(q => q.id === m.id); if (x) x.role = v; localStorage.setItem(DK, JSON.stringify(d)); await load(); } else { const r = await sb.from('people').update({ role: v }).eq('id', m.id); if (r.error) throw r.error; await load(); } dlg.close(); render(); toast(v ? 'Ik ben een ' + v : 'Functie weggehaald'); } catch (err) { console.error(err); toast('Opslaan mislukt. Is supabase-rollen.sql uitgevoerd?'); }
  };
}
function nameDialog() {
  const m = me(); dlg.innerHTML = `<h2>Naam wijzigen</h2><input id="nm" value="${esc(m.name)}" maxlength="30" autocomplete="off"><div class="acts"><button class="btn" data-d="ok">Opslaan</button><button class="btn g" data-d="no">Annuleer</button></div>`; dlg.showModal();
  dlg.onclick = async e => { const d = e.target.closest('[data-d]')?.dataset.d; if (!d) { if (e.target === dlg) dlg.close(); return; } if (d === 'no') return dlg.close();
    const v = $('nm').value.trim(); if (!v) return $('nm').focus(); if (people.some(p => p.id !== m.id && p.name.toLowerCase() === v.toLowerCase())) return toast('Die naam bestaat al');
    try { if (demo) { const d = dread(); const x = d.people.find(q => q.id === m.id); if (x) x.name = v; localStorage.setItem(DK, JSON.stringify(d)); await load(); } else { const r = await sb.from('people').update({ name: v }).eq('id', m.id); if (r.error) throw r.error; await load(); } dlg.close(); render(); toast('Naam bijgewerkt'); } catch (err) { console.error(err); toast('Opslaan mislukt'); } };

  const t = e.target.closest('[data-a],[data-s],[data-p]'); if (!t) return; const D = t.dataset;
  if (D.s) return go('straat', D.s);

  if (D.a === 'share') { const url = location.origin + location.pathname.replace(/profiel\.html$/, '') + '#persoon=' + meId; try { if (navigator.share) await navigator.share({ title: me().name + ' · Pannenkoekenverkoop', url }); else { await navigator.clipboard.writeText(url); toast('Link gekopieerd'); } } catch {} }
});
