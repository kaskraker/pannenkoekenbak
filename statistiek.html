<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F1EB">
<title>Statistiek</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest-statistiek.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Statistiek">
<style>
:root{--bone:#F4F1EB;--pagina:#FAF8F4;--kaart:#EFEAE1;--donker:#272727;--zacht:#6f695d;--lijn:#D5CCBF;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bone);color:var(--donker);font:500 16px/1.4 var(--font);-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 40px)}
h1{margin:0;font-size:30px;letter-spacing:-.03em}.sub{color:var(--zacht);font-size:14.5px;margin-top:2px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
.card{background:var(--pagina);border-radius:22px;padding:16px;box-shadow:0 0 0 .5px rgba(39,39,39,.08),0 6px 20px rgba(39,39,39,.07)}
.login{margin-top:34px}.login p{color:var(--zacht);margin:0 0 14px}
input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border:0;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--lijn);color:var(--donker);outline:none}
input:focus{box-shadow:inset 0 0 0 2px var(--donker)}
.btn{display:flex;justify-content:center;width:100%;margin-top:12px;padding:15px;border-radius:99px;background:linear-gradient(180deg,#3d3d3d,#242424);color:#fff;font-weight:700;font-size:16px}
.err{color:#b3261e;font-size:14px;margin-top:10px;min-height:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 14px}
.t{background:var(--pagina);border-radius:20px;padding:14px 16px;box-shadow:0 0 0 .5px rgba(39,39,39,.08)}
.t b{display:block;font-size:34px;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}.t span{font-size:13.5px;color:var(--zacht)}
h2{margin:22px 4px 8px;font-size:13.5px;font-weight:700;color:var(--zacht)}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding:4px 2px 0}
.chart i{flex:1;min-width:0;background:var(--donker);border-radius:4px 4px 1px 1px;opacity:.85;position:relative}
.chart i.leeg{background:var(--lijn);height:3px!important}
.ax{display:flex;justify-content:space-between;font-size:12px;color:var(--zacht);margin-top:6px;padding:0 2px}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}td{padding:9px 4px;border-top:1px solid var(--kaart)}tr:first-child td{border-top:0}td:nth-child(n+2){text-align:right}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:13.5px;color:var(--zacht)}
.link{text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<main id="m"></main>
<script src="config.js"></script>
<script>
const cfg = window.PANNENKOEK_CONFIG || {}, $ = id => document.getElementById(id), KEY = 'pb-stat-code';
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let code = ''; try { code = localStorage.getItem(KEY) || ''; } catch {}
async function haal(c) {
  const r = await fetch(cfg.SUPABASE_URL + '/rest/v1/rpc/app_stats', { method: 'POST', headers: { apikey: cfg.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + cfg.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ code: c }) });
  if (r.status === 401 || r.status === 403 || r.status === 400) throw new Error('Die code klopt niet.');
  if (r.status === 404) throw new Error('Het statistiekscherm is nog niet ingesteld. Voer supabase-statistiek-app.sql uit.');
  if (!r.ok) throw new Error('Ophalen mislukt (' + r.status + ').');
  return r.json();
}
function login(fout) {
  $('m').innerHTML = `<h1>Statistiek</h1><div class="sub">Pannenkoekenverkoop Ingelmunster</div>
    <div class="card login"><p>Vul je geheime code in om de cijfers te zien.</p><input id="c" type="password" autocomplete="current-password" placeholder="Code" enterkeyhint="go"><button class="btn" id="go">Openen</button><div class="err" id="e">${esc(fout || '')}</div></div>`;
  const go = async () => { const c = $('c').value.trim(); if (!c) return $('c').focus(); $('go').textContent = 'Even kijken…'; try { const d = await haal(c); code = c; try { localStorage.setItem(KEY, c); } catch {} toon(d); } catch (e) { login(e.message); } };
  $('go').onclick = go; $('c').onkeydown = e => { if (e.key === 'Enter') go(); }; $('c').focus();
}
const NAAM = { scherm_kaart: 'Kaart bekeken', scherm_feed: 'Feed bekeken', scherm_rang: 'Cijfers bekeken', scherm_ik: 'Ik-scherm bekeken', straat_aangeduid: 'Straat aangeduid', bericht_geplaatst: 'Bericht geplaatst', profielfoto_gewijzigd: 'Profielfoto gewijzigd', figuur_gekozen: 'Figuur gekozen', functie_gekozen: 'Functie gekozen', functie_weggehaald: 'Functie weggehaald', welkom_getoond: 'Welkomstscherm getoond', welkom_doe_mee: 'Welkom: Ik doe mee', welkom_rondkijken: 'Welkom: eerst rondkijken', rondleiding_start: 'Rondleiding gestart', rondleiding_klaar: 'Rondleiding afgemaakt', rondleiding_overslaan: 'Rondleiding overgeslagen', verkopen_open: 'Wil je ook verkopen? geopend', verkopen_bel: 'Verkopen: Bel getikt', verkopen_whatsapp: 'Verkopen: WhatsApp getikt', installeer_tik: 'Installeren getikt' };
const dag = d => { const x = new Date(d + 'T12:00:00'); return x.toLocaleDateString('nl-BE', { weekday: 'short', day: 'numeric', month: 'short' }); };
function toon(d) {
  const dagen = d.dagen || [], map = new Map(dagen.map(x => [x.dag, x])), rij = [];
  for (let i = 29; i >= 0; i--) { const t = new Date(Date.now() - i * 864e5), k = t.toLocaleDateString('sv-SE', { timeZone: 'Europe/Brussels' }); rij.push({ dag: k, toestellen: map.get(k)?.toestellen || 0, keren: map.get(k)?.keren || 0 }); }
  const max = Math.max(1, ...rij.map(x => x.toestellen));
  $('m').innerHTML = `<h1>Statistiek</h1><div class="sub">Pannenkoekenverkoop Ingelmunster</div>
    <div class="grid"><div class="t"><b>${d.toestellen}</b><span>toestellen in totaal</span></div><div class="t"><b>${d.vandaag}</b><span>vandaag</span></div><div class="t"><b>${d.zeven_dagen}</b><span>laatste 7 dagen</span></div><div class="t"><b>${d.geinstalleerd}</b><span>op het beginscherm</span></div></div>
    <h2>Toestellen per dag, laatste 30 dagen</h2><div class="card"><div class="chart">${rij.map(x => `<i class="${x.toestellen ? '' : 'leeg'}" style="height:${x.toestellen ? Math.max(6, x.toestellen / max * 100) : 3}%" title="${esc(dag(x.dag))}: ${x.toestellen}"></i>`).join('')}</div><div class="ax"><span>${esc(dag(rij[0].dag))}</span><span>vandaag</span></div></div>
    <h2>Laatste dagen</h2><div class="card"><table>${rij.slice(-10).reverse().map(x => `<tr><td>${esc(dag(x.dag))}</td><td>${x.toestellen} ${x.toestellen === 1 ? 'toestel' : 'toestellen'}</td><td>${x.keren}× geopend</td></tr>`).join('')}</table></div>
    ${(d.events && d.events.length) ? `<h2>Wat mensen doen, laatste 30 dagen</h2><div class="card"><table>${d.events.map(x => `<tr><td>${esc(NAAM[x.ev] || x.ev)}</td><td>${x.toestellen} ${x.toestellen === 1 ? 'toestel' : 'toestellen'}</td><td>${x.keren}×</td></tr>`).join('')}</table></div>` : ''}
    <div class="foot"><span>${d.keren} keer geopend in totaal</span><span><button class="link" id="ver">Vernieuwen</button> · <button class="link" id="uit">Uitloggen</button></span></div>`;
  $('ver').onclick = () => start(); $('uit').onclick = () => { try { localStorage.removeItem(KEY); } catch {} code = ''; login(); };
}
async function start() { if (!code) return login(); try { toon(await haal(code)); } catch (e) { login(e.message); } }
if (!cfg.SUPABASE_URL) $('m').innerHTML = '<h1>Statistiek</h1><div class="sub">De database is niet ingesteld.</div>'; else { start(); setInterval(() => { if (code && !document.hidden) haal(code).then(toon).catch(() => {}); }, 60000); }
</script>
</body>
</html>
